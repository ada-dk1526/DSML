<style>
:root{--ink:#183349;--muted:#526679;--blue:#2463b7;--red:#bc3c4b;--paper:#fcfcfa;--line:#d6dfe7;--accent:#28567c;--focus:#8f4a0f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button,a,input,select{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button{border:1px solid #b7c7d3;border-radius:5px;padding:9px 15px;color:var(--ink);background:white;min-height:42px}button:hover{background:#eaf0f6}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.primary:hover{background:#183e5e}a{color:var(--accent);text-underline-offset:3px}select{max-width:100%;border:1px solid #b7c7d3;border-radius:4px;padding:8px;background:white;color:var(--ink)}
.deck{display:flex;min-height:100dvh;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 38px 0;font-size:14px;color:var(--muted)}.top .course{letter-spacing:.06em;text-transform:uppercase}.top nav{display:flex;align-items:center;gap:18px}.top button{font-size:14px;min-height:32px;padding:5px 10px;background:transparent}.slide{flex:1;max-width:1550px;width:100%;margin:auto;padding:20px 38px 10px;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(32px,3.1vw,48px);font-weight:600;letter-spacing:-.025em;margin:0 0 20px;line-height:1.1}h2{font-size:25px;line-height:1.2;font-weight:600;margin:0 0 12px}.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:38px;align-items:center}.visual{min-width:0}.chart{display:block;width:100%;height:clamp(330px,60vh,550px);overflow:visible}.chart.interactive{touch-action:none;cursor:crosshair}.chart text{font:17px Arial,Helvetica,sans-serif;fill:var(--ink)}.chart .tick{font-size:14px;fill:var(--muted)}.chart .axis{font-size:16px;fill:var(--muted)}.chart .point-label{font-weight:600;font-size:15px;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}.copy{font-size:clamp(20px,1.8vw,27px);line-height:1.42;min-width:0}.copy p{margin:0 0 18px}.copy .lead{font-size:1.17em;line-height:1.35}.copy .muted{color:var(--muted);font-size:.77em;line-height:1.45}.copy .pause{border-left:3px solid var(--accent);padding-left:18px}.formula{font-family:Georgia,'Times New Roman',serif;font-size:1.18em;margin:20px 0;line-height:1.55}.formula .small{font-size:.85em}.formula sup,.formula sub{font-size:.65em}.answer{font-size:1.18em;font-weight:600;margin:16px 0}.blue{color:var(--blue)}.red{color:var(--red)}.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:16px;color:var(--muted);justify-content:center;margin:2px 0 10px}.legend span{display:inline-flex;align-items:center;gap:8px}.mark{width:12px;height:12px;display:inline-block;background:var(--blue);border-radius:50%}.mark.red{background:var(--red);border-radius:0}.mark.query{width:16px;height:16px;background:transparent;color:var(--ink);font-size:24px;line-height:16px;font-weight:700}
.rank{font-size:18px;border-collapse:collapse;width:100%;margin:14px 0}.rank td,.rank th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}.rank th{font-size:16px;color:var(--muted);font-weight:500}.rank td:last-child,.rank th:last-child{text-align:right;font-variant-numeric:tabular-nums}.rank .chosen{background:#eef2f5}.chips{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.chips span{padding:5px 0;font-weight:600;font-size:21px}.chips span+span:before{content:' + ';color:var(--muted);margin-right:10px}.controls{font-size:17px;margin:16px 0}.controls label{display:flex;align-items:center;gap:12px;margin:10px 0}.controls label span{min-width:72px}.controls input[type=range]{accent-color:var(--accent);width:min(215px,45vw)}.controls output{font-variant-numeric:tabular-nums;min-width:32px}.controls .buttons{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.controls button{font-size:16px;padding:7px 11px}.live{border-top:1px solid var(--line);padding-top:12px;margin-top:15px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:26px;grid-column:1/-1}.stage:has(.compare){row-gap:12px}.compare .chart{height:clamp(260px,40vh,380px)}.compare h2{text-align:center}.compare .result{text-align:center;font-size:23px;min-height:34px}.compare .legend{margin-bottom:0}.compare-caption{grid-column:1/-1;font-size:22px;text-align:center;max-width:960px;margin:6px auto 0;line-height:1.4}.source{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.3}.bottom{padding:15px 38px 20px;border-top:1px solid var(--line);display:flex;gap:18px;align-items:center;justify-content:space-between}.position{font-size:14px;line-height:1.5;color:var(--muted);min-width:105px}.bottom .actions{display:flex;align-items:center;gap:10px}.bottom select{font-size:15px;max-width:330px}.bottom #advance{min-width:150px}.progress{height:3px;background:#e6ecf0}.progress>div{height:3px;background:var(--accent);transition:width .2s}.shortcut{font-size:13px;color:var(--muted)}.tie{font-size:.73em;color:#8a4b10;background:#fcf4e8;padding:9px 12px;line-height:1.4}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:1500px){.copy{font-size:28px}.chart text{font-size:19px}.rank{font-size:21px}}
@media(max-width:900px){.stage{grid-template-columns:1fr;gap:15px}.slide{padding:22px 20px}.top{padding:12px 20px 0}.top .course{font-size:11px}.top nav{gap:12px}.chart{height:360px}.copy{font-size:21px}.bottom{padding:14px 20px;flex-wrap:wrap}.bottom select{max-width:100%;flex:1}.shortcut{display:none}.compare{gap:14px}.compare .chart{height:330px}.compare-caption{font-size:20px}}
@media(max-width:540px){.top{align-items:flex-start;gap:8px}.top .course{max-width:165px;line-height:1.5}.top nav{font-size:12px;gap:9px}.top button{font-size:12px;padding:4px 7px}.slide{padding:22px 16px 16px}h1{font-size:31px}.chart{height:340px}.copy{font-size:20px}.bottom{padding:12px 16px;gap:10px}.bottom .actions{width:100%;justify-content:space-between}.bottom .position{min-width:auto}.bottom select{font-size:13px}.compare{grid-template-columns:1fr}.compare .chart{height:320px}.compare-caption{font-size:19px}.legend{font-size:14px;gap:14px}}

<body>
<div class="deck">
<header class="top"><span class="course">Data Science and Machine Learning<br>Deep Dive</span><nav><a href="../index.html">All deep dives</a><a href="Instructor_Notes.html" target="_blank" rel="noopener">Teaching notes</a><button type="button" id="fullscreen">Full screen</button></nav></header>
<main class="slide" aria-labelledby="slide-title"><h1 id="slide-title"></h1><div id="stage" class="stage"></div><div class="source" id="source"></div></main>
<footer class="bottom"><div class="position"><span id="counter"></span><br><span id="step-counter"></span></div><label class="sr-only" for="jump">Choose a slide</label><select id="jump"></select><div class="actions"><button type="button" id="back">Previous</button><button type="button" id="reset" aria-label="Reset current slide">Reset</button><button type="button" class="primary" id="advance">Reveal</button></div><span class="shortcut">← / → or Space<br>R reset · F full screen</span></footer>
<div class="progress" aria-hidden="true"><div id="progress"></div></div><div id="announcement" class="sr-only" aria-live="polite"></div>
</div>
<script>
'use strict';
const points=[{id:'B1',x:1,y:1.2,label:0},{id:'B2',x:1,y:2.2,label:0},{id:'B3',x:1.5,y:3.2,label:0},{id:'B4',x:2,y:2.5,label:0},{id:'B5',x:2,y:1,label:0},{id:'R1',x:3.4,y:3.6,label:1},{id:'R2',x:3.8,y:4.8,label:1},{id:'R3',x:4.4,y:4.1,label:1},{id:'R4',x:4.5,y:3,label:1},{id:'R5',x:5.2,y:3.8,label:1},{id:'R6',x:5.4,y:4.8,label:1}];
const BLUE='#2463b7',RED='#bc3c4b',INK='#183349';
function predict(data,q,k,metric='euclidean',flip=false){
 const ranked=data.map((p,index)=>{const dx=p.x-q[0],dy=p.y-q[1];return {...p,index,label:flip&&p.id==='R1'?1-p.label:p.label,distance:metric==='manhattan'?Math.abs(dx)+Math.abs(dy):Math.hypot(dx,dy)};}).sort((a,b)=>{const delta=a.distance-b.distance;return Math.abs(delta)<1e-10?a.index-b.index:delta;});
 const selected=ranked.slice(0,k),red=selected.reduce((n,p)=>n+p.label,0),blue=k-red;
 return {ranked,selected,red,blue,prediction:red>blue?1:0,cutoffTie:k<ranked.length&&Math.abs(ranked[k-1].distance-ranked[k].distance)<1e-10,voteTie:red===blue};
}
const slides=[
 {title:'K-nearest neighbours',steps:1,source:'KNN notes, page 1 · Illustrative coordinates',note:'A new point needs a label'},
 {title:'Stored examples and distance',steps:3,source:'KNN notes, pages 1–3',note:'One Euclidean calculation'},
 {title:'One nearest neighbour',steps:3,source:'KNN notes, pages 1–2',note:'Distance, selection, prediction'},
 {title:'A moving query',steps:1,source:'KNN notes, page 1',note:'Move the query'},
 {title:'Nearest-neighbour regions',steps:2,source:'KNN notes, page 1',note:'Voronoi cells and class boundaries'},
 {title:'One changed label',steps:2,source:'KNN notes, page 1',note:'Keep the geometry fixed'},
 {title:'Three neighbours vote',steps:4,source:'KNN notes, pages 1–2',note:'Reveal one voter at a time'},
 {title:'One vote or three?',steps:1,source:'KNN notes, pages 1–3',note:'Compare sensitivity'},
 {title:'How local is the neighbourhood?',steps:2,source:'KNN notes, page 3',note:'Change k'},
 {title:'What counts as close?',steps:2,source:'KNN notes, page 3',note:'Change only the metric'},
 {title:'Votes and uncertainty',steps:2,source:'KNN notes, pages 1–2 · Probability interpretation clarified',note:'Interpret a vote fraction'},
 {title:'One new prediction',steps:2,source:'KNN notes, pages 1–3',note:'Explain the complete decision'}
];
function initial(i){return {step:0,q:i===9?[3.6,1.5]:i===11?[2.2,2.5]:[3.2,4.3],k:i===8||i===9||i===11?3:1,metric:'euclidean',flip:[6,7,10].includes(i)};}
let states=slides.map((_,i)=>initial(i)),index=0;
const $=id=>document.getElementById(id),s=()=>states[index];
function legend(){return '<div class="legend"><span><i class="mark"></i>Blue class</span><span><i class="mark red"></i>Red class</span><span><i class="mark query">+</i>Query</span></div>';}
function visual(id='geometry'){return '<div class="visual"><svg id="'+id+'" class="chart" role="img" aria-label="Labelled training observations and the query"></svg>'+legend()+'</div>';}
function result(r){return '<div class="answer '+(r.prediction?'red':'blue')+'">Prediction: '+(r.prediction?'Red':'Blue')+'</div>';}
function votes(r){return '<p><span class="blue">Blue: '+r.blue+'</span> &nbsp; <span class="red">Red: '+r.red+'</span></p>';}
function rows(r,n,selected=0){return '<table class="rank"><thead><tr><th>Point</th><th>Class</th><th>Distance</th></tr></thead><tbody>'+r.ranked.slice(0,n).map((p,i)=>'<tr class="'+(i<selected?'chosen':'')+'"><td>'+p.id+'</td><td class="'+(p.label?'red':'blue')+'">'+(p.label?'Red':'Blue')+'</td><td>'+p.distance.toFixed(3)+'</td></tr>').join('')+'</tbody></table>';}
function tieNote(r){return (r.cutoffTie?'<p class="tie">Equal distance at the cutoff: use the fixed listed row order.</p>':'')+(r.voteTie?'<p class="tie">Equal class votes: this demonstration selects Blue.</p>':'');}
function queryControls(){return '<div class="controls"><label><span>Query x</span><input id="qx" type="range" min="0" max="6" step="0.1" value="'+s().q[0]+'"><output for="qx" id="qx-value">'+s().q[0].toFixed(1)+'</output></label><label><span>Query y</span><input id="qy" type="range" min="0" max="5" step="0.1" value="'+s().q[1]+'"><output for="qy" id="qy-value">'+s().q[1].toFixed(1)+'</output></label><div class="buttons"><button type="button" data-query="red">Red region</button><button type="button" data-query="blue">Blue region</button></div></div>';}
function render(){
 const st=s(),t=st.step;let right='',chart={q:st.q,k:1,flip:st.flip,metric:st.metric,selected:0},r=predict(points,st.q,st.k,st.metric,st.flip);
 $('slide-title').textContent=slides[index].title;$('source').textContent=slides[index].source;
 if(index===0){right='<p class="lead">What class should the new point receive?</p><p class="pause">Make a prediction and name the observations that support it.</p>'+(t?'<p>We will make “nearby” precise, then inspect which observations get a vote.</p>':'<p class="muted">15–20 minutes<br>Uniform voting, two classes, numeric features</p>');}
 if(index===1){right=t===0?'<p class="lead">The model retains labelled examples.</p><p>For the query <strong>(3.2, 4.3)</strong>, compare its distance to each stored input.</p><p class="muted">No parametric boundary is fitted. A neighbour-search index may still be built.</p>':'<p>Euclidean distance to <strong>R1 = (3.4, 3.6)</strong></p><div class="formula">d² = (x₁ − q₁)² + (x₂ − q₂)²</div>'+(t>=2?'<div class="formula">= (0.2)² + (−0.7)²</div>':'<p class="pause">Which differences enter the calculation?</p>')+(t>=3?'<div class="formula">= 0.04 + 0.49 = 0.53<br>d = √0.53 ≈ <strong>0.728</strong></div>':'');if(t)chart.measure='R1';}
 if(index===2){right=t===0?'<p class="lead">Which stored observation is closest?</p><p class="pause">Choose one before revealing the distance ranking.</p>':rows(r,5,t>=2?1:0)+(t>=3?result(r)+'<p>For 1-NN, copy the selected neighbour’s label.</p>':'<p class="pause">'+(t===1?'Which row determines the 1-NN prediction?':'What class does that observation carry?')+'</p>');chart.selected=t>=2?1:0;}
 if(index===3){right='<p class="lead">Where can the prediction change?</p>'+(t?queryControls()+'<div id="live" class="live" aria-live="polite" aria-atomic="true"></div><p class="muted">Drag or click the plot, or use the query sliders.</p>':'<p class="pause">Predict what happens as the query moves between the two groups.</p>');chart.selected=t?1:0;chart.interactive=!!t;}
 if(index===4){right=t===0?'<p class="lead">Each training point owns a region.</p><p class="pause">Where would the identity of the nearest point change?</p>':'<p>Thin edges separate nearest-point regions.</p>'+(t>=2?'<p><strong>Dark edges</strong> separate predicted classes.</p><div class="controls"><div class="buttons"><button type="button" data-cell="first">q = (3.2, 4.3)</button><button type="button" data-cell="second">q = (3.2, 4.4)</button></div></div><div id="live" class="live" aria-live="polite" aria-atomic="true"></div><p class="muted">Cross a cell edge between R1 and R2. Does the class also change?</p>':'<p class="pause">Must crossing any cell edge change the predicted class?</p>');chart.voronoi=t>=1;chart.classEdges=t>=2;chart.selected=t?1:0;}
 if(index===5){chart.flip=t>=1;chart.selected=1;chart.voronoi=t>=2;chart.classEdges=t>=2;r=predict(points,st.q,1,'euclidean',chart.flip);right='<p class="lead">Change only R1’s label.</p><p>The inputs, query and distance rule stay fixed.</p>'+(t===0?'<p class="pause">What will 1-NN predict if R1 changes from Red to Blue?</p>':t===1?'<p><strong>R1 now carries the Blue label.</strong></p><p class="pause">Which part of feature space should change its prediction?</p>':result(r)+'<p>The nearest point stays R1. The label attached to its region changes.</p>');}
 if(index===6){chart.k=3;chart.selected=Math.min(t,3);r=predict(points,st.q,3,'euclidean',true);right='<p class="lead">Keep the changed label. Let k = 3.</p>'+(t===0?'<p class="pause">Will the prediction still follow R1?</p>':'<div class="chips">'+r.selected.slice(0,Math.min(t,3)).map(p=>'<span class="'+(p.label?'red':'blue')+'">'+p.id+': '+(p.label?'Red':'Blue')+'</span>').join('')+'</div>')+(t>=4?votes(r)+result(r)+'<p>The majority vote decides the class.</p>':'<p class="muted">Reveal each selected neighbour before counting the votes.</p>');}
 if(index===7){const r1=predict(points,st.q,1,'euclidean',true),r3=predict(points,st.q,3,'euclidean',true);$('stage').innerHTML='<div class="compare"><section><h2>k = 1</h2>'+visual('compare-one')+'<div class="result">'+(t?'<span class="blue">Blue: 1 vote</span>':'Prediction?')+'</div></section><section><h2>k = 3</h2>'+visual('compare-three')+'<div class="result">'+(t?'<span class="red">Red: 2 of 3 votes</span>':'Prediction?')+'</div></section></div><p class="compare-caption">'+(t?'Why is the three-neighbour decision less sensitive to this one changed label? Would that guarantee better predictions on new data?':'The same stored examples and changed label. Only the number of voters differs.')+'</p>';draw($('compare-one'),{q:st.q,k:1,flip:true,selected:t?1:0});draw($('compare-three'),{q:st.q,k:3,flip:true,selected:t?3:0});finish();return;}
 if(index===8){chart.k=st.k;chart.selected=t?st.k:0;right='<p class="lead">Restore the original labels.</p>'+(t===0?'<p class="pause">With k = 11, would moving the query change the uniform-vote prediction?</p>':'<div class="controls"><label><span>Neighbours</span><input id="k" type="range" min="1" max="11" step="1" value="'+st.k+'"><output id="k-value" for="k">'+st.k+'</output></label><div class="buttons"><button type="button" data-k="1">k = 1</button><button type="button" data-k="3">k = 3</button><button type="button" data-k="11">All 11</button></div></div><div id="live" class="live" aria-live="polite" aria-atomic="true"></div>')+(t>=2?'<p>At k = n, every query receives the global majority vote.</p><p class="muted">Choose k using validation within the training data. Larger k is not always better.</p>':'');}
 if(index===9){chart.k=3;chart.selected=t?3:0;chart.contour=!!t;right='<p>Keep <strong>q = (3.6, 1.5)</strong> and <strong>k = 3</strong> fixed.</p>'+(t===0?'<p class="pause">Can changing only the distance rule change the prediction?</p>':'<div class="controls"><label><span>Distance</span><select id="metric"><option value="euclidean" '+(st.metric==='euclidean'?'selected':'')+'>Euclidean</option><option value="manhattan" '+(st.metric==='manhattan'?'selected':'')+'>Manhattan</option></select></label></div><div class="formula" id="metric-formula"></div><div id="live" class="live" aria-live="polite" aria-atomic="true"></div>')+(t>=2?'<p class="muted">A circle and a diamond can admit different neighbours. Feature meanings and units also shape this choice.</p>':'');}
 if(index===10){chart.k=3;chart.selected=3;r=predict(points,st.q,3,'euclidean',true);right='<p class="lead">Two Red votes out of three.</p>'+votes(r)+(t===0?'<p class="pause">Does this establish a 67% chance that the query is truly Red?</p>':'<div class="formula">Local Red vote fraction = 2/3</div>')+(t>=2?'<p>This describes the selected labels. It is not automatically a calibrated probability.</p><p class="muted">Neighbour votes are not independent repeated experiments. Calibration needs evidence on held-out data.</p>':'');}
 if(index===11){chart.k=3;chart.selected=t?3:0;r=predict(points,st.q,3);right='<p><strong>q = (2.2, 2.5), k = 3</strong><br>Euclidean distance, original labels.</p>'+(t===0?'<p class="pause">Name the neighbours, predict the class and explain the rule in a complete sentence.</p>':rows(r,3,3)+result(r))+(t>=2?'<p>A KNN prediction depends on how we define and use a neighbourhood.</p><p class="muted">The next deep-dive sections extend this idea to regression, distance weights and neighbour search.</p>':'');}
 $('stage').innerHTML=visual()+'<section class="copy">'+right+'</section>';
 draw($('geometry'),chart);bindControls();updateLive();finish();
}
function finish(){
 $('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+slides[index].steps;$('jump').value=index;
 $('back').disabled=index===0&&s().step===0;$('advance').textContent=s().step<slides[index].steps?'Reveal next':index<slides.length-1?'Next slide':'Start again';
 $('progress').style.width=(100*(index+s().step/slides[index].steps)/slides.length)+'%';
 $('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+slides[index].steps;
 window.knnLesson.state={index,...s()};
}
function updateLive(){
 if(!$('live'))return;const st=s(),k=index===3||index===4?1:st.k,r=predict(points,st.q,k,st.metric,false);
 $('live').innerHTML=(index===3||index===4?'<p>Nearest point: <strong>'+r.selected[0].id+'</strong></p>':'<p style="font-size:.82em">Selected: <strong>'+r.selected.map(p=>p.id).join(', ')+'</strong></p>'+votes(r))+result(r)+tieNote(r);
 if($('metric-formula'))$('metric-formula').innerHTML=st.metric==='euclidean'?'d = √(Δx₁² + Δx₂²)':'d = |Δx₁| + |Δx₂|';
 for(const key of ['qx','qy'])if($(key+'-value'))$(key+'-value').textContent=st.q[key==='qx'?0:1].toFixed(1);
 if($('k-value'))$('k-value').textContent=st.k;
 window.knnLesson.state={index,...st};
}
function redrawLive(){
 const st=s();draw($('geometry'),{q:st.q,k:[3,4].includes(index)?1:st.k,selected:[3,4].includes(index)?1:st.k,metric:st.metric,interactive:index===3,voronoi:index===4,classEdges:index===4&&st.step>=2,contour:index===9});updateLive();
}
function bindControls(){
 ['qx','qy'].forEach((key,i)=>{if($(key))$(key).oninput=e=>{s().q[i]=+e.target.value;redrawLive();};});
 if($('k'))$('k').oninput=e=>{s().k=+e.target.value;redrawLive();};if($('metric'))$('metric').onchange=e=>{s().metric=e.target.value;redrawLive();};
 document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{s().q=b.dataset.query==='red'?[3.2,4.3]:[2.2,2.5];$('qx').value=s().q[0];$('qy').value=s().q[1];redrawLive();});
 document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{s().q=b.dataset.cell==='first'?[3.2,4.3]:[3.2,4.4];redrawLive();});
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{s().k=+b.dataset.k;$('k').value=s().k;redrawLive();});
}
function clip(poly,a,b,c){let out=[];for(let i=0;i<poly.length;i++){const u=poly[i],v=poly[(i+1)%poly.length],fu=a*u[0]+b*u[1]-c,fv=a*v[0]+b*v[1]-c,insideU=fu<=1e-9,insideV=fv<=1e-9;if(insideU)out.push(u);if(insideU!==insideV){const t=fu/(fu-fv);out.push([u[0]+t*(v[0]-u[0]),u[1]+t*(v[1]-u[1])]);}}return out;}
function cells(){return points.map((p,i)=>{let poly=[[0,0],[6,0],[6,5],[0,5]];for(let j=0;j<points.length;j++)if(i!==j){const q=points[j];poly=clip(poly,q.x-p.x,q.y-p.y,(q.x*q.x+q.y*q.y-p.x*p.x-p.y*p.y)/2);}return poly;});}
const voronoi=cells();
function draw(svg,options){
 if(!svg)return;const {q=[3.2,4.3],k=1,metric='euclidean',flip=false,selected=0,measure=null,interactive=false,contour=false}=options;
 const w=Math.max(280,svg.clientWidth),h=svg.clientHeight||420,u=Math.min((w-76)/6,(h-70)/5),pw=6*u,ph=5*u,left=50+Math.max(0,(w-76-pw)/2),top=16+Math.max(0,(h-70-ph)/2),X=v=>left+v*u,Y=v=>top+ph-v*u;
 svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.classList.toggle('interactive',interactive);svg.setAttribute('aria-label','Training observations. Query at '+q.join(', ')+'. '+(selected?'Selected '+selected+' nearest observations.':'No neighbours revealed yet.'));
 const r=predict(points,q,k,metric,flip),chosen=r.ranked.slice(0,selected),colour=p=>flip&&p.id==='R1'?BLUE:p.label?RED:BLUE;
 let html='<title>KNN feature space</title><desc>Blue circles and red squares show class labels. A dark cross marks the query.</desc><defs><clipPath id="clip-'+svg.id+'"><rect x="'+left+'" y="'+top+'" width="'+pw+'" height="'+ph+'"/></clipPath></defs>';
 if(options.voronoi){voronoi.forEach((poly,i)=>{html+='<polygon points="'+poly.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'" fill="'+colour(points[i])+'" fill-opacity=".10" stroke="#aebdc9" stroke-width="1"/>';});}
 for(let n=0;n<=6;n++){html+='<line x1="'+X(n)+'" y1="'+Y(0)+'" x2="'+X(n)+'" y2="'+Y(5)+'" stroke="#e2e7ed" stroke-width=".8"/><text class="tick" x="'+X(n)+'" y="'+(Y(0)+22)+'" text-anchor="middle">'+n+'</text>';}
 for(let n=0;n<=5;n++){html+='<line x1="'+X(0)+'" y1="'+Y(n)+'" x2="'+X(6)+'" y2="'+Y(n)+'" stroke="#e2e7ed" stroke-width=".8"/><text class="tick" x="'+(left-14)+'" y="'+(Y(n)+5)+'" text-anchor="end">'+n+'</text>';}
 html+='<rect x="'+left+'" y="'+top+'" width="'+pw+'" height="'+ph+'" fill="none" stroke="#aebdc9"/><text class="axis" x="'+X(3)+'" y="'+(Y(0)+45)+'" text-anchor="middle">Feature 1</text><text class="axis" transform="translate(17 '+Y(2.5)+') rotate(-90)" text-anchor="middle">Feature 2</text>';
 if(options.classEdges){voronoi.forEach((poly,i)=>{poly.forEach((a,n)=>{const b=poly[(n+1)%poly.length],m=[(a[0]+b[0])/2,(a[1]+b[1])/2],di=(m[0]-points[i].x)**2+(m[1]-points[i].y)**2;const j=points.findIndex((p,j)=>j!==i&&Math.abs((m[0]-p.x)**2+(m[1]-p.y)**2-di)<1e-7);if(j>i&&colour(points[j])!==colour(points[i]))html+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="'+INK+'" stroke-width="2.8"/>';});});}
 if(contour){const d=r.selected[k-1].distance;html+='<g clip-path="url(#clip-'+svg.id+')">'+(metric==='euclidean'?'<circle cx="'+X(q[0])+'" cy="'+Y(q[1])+'" r="'+d*u+'"':'<polygon points="'+[[q[0]+d,q[1]],[q[0],q[1]+d],[q[0]-d,q[1]],[q[0],q[1]-d]].map(p=>X(p[0])+','+Y(p[1])).join(' ')+'"')+' fill="none" stroke="#657f95" stroke-width="2" stroke-dasharray="6 5"/></g>';}
 for(const p of chosen){html+='<line x1="'+X(q[0])+'" y1="'+Y(q[1])+'" x2="'+X(p.x)+'" y2="'+Y(p.y)+'" stroke="#72899d" stroke-width="1.8" stroke-dasharray="5 5"/>';}
 if(measure){const p=points.find(p=>p.id===measure);html+='<path d="M'+X(q[0])+','+Y(q[1])+' L'+X(p.x)+','+Y(q[1])+' L'+X(p.x)+','+Y(p.y)+' Z" fill="#dfebf4" fill-opacity=".5" stroke="#516b81" stroke-width="2"/>';}
 for(const p of points){const c=colour(p),cx=X(p.x),cy=Y(p.y),isRed=c===RED;if(chosen.some(n=>n.id===p.id))html+='<circle cx="'+cx+'" cy="'+cy+'" r="15" fill="none" stroke="'+INK+'" stroke-width="2"/>';html+=(isRed?'<rect x="'+(cx-6.5)+'" y="'+(cy-6.5)+'" width="13" height="13"':'<circle cx="'+cx+'" cy="'+cy+'" r="7"')+' fill="'+c+'" stroke="#fcfcfa" stroke-width="1.3"/><text class="point-label" x="'+(cx+13)+'" y="'+(cy+(p.id==='R2'||p.id==='R6'?21:-11))+'">'+p.id+'</text>';}
 html+='<path d="M'+(X(q[0])-10)+' '+Y(q[1])+'h20 M'+X(q[0])+' '+(Y(q[1])-10)+'v20" stroke="#fcfcfa" stroke-width="7"/><path d="M'+(X(q[0])-10)+' '+Y(q[1])+'h20 M'+X(q[0])+' '+(Y(q[1])-10)+'v20" stroke="'+INK+'" stroke-width="3.5"/>';
 const qAnchor=q[0]>5?'end':'start',qx=q[0]>5?X(q[0])-14:X(q[0])+14,qy=q[1]<.4?Y(q[1])-16:Y(q[1])+27;
 html+='<text class="point-label" x="'+qx+'" y="'+qy+'" text-anchor="'+qAnchor+'">q</text>';svg.innerHTML=html;
 if(interactive){const move=e=>{const rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)*w/rect.width,py=(e.clientY-rect.top)*h/rect.height;s().q=[Math.round(Math.max(0,Math.min(6,(px-left)/u))*10)/10,Math.round(Math.max(0,Math.min(5,(top+ph-py)/u))*10)/10];$('qx').value=s().q[0];$('qy').value=s().q[1];redrawLive();};svg.onpointerdown=e=>{if(e.button!==0)return;svg.setPointerCapture(e.pointerId);svg.dataset.dragging='yes';move(e);};svg.onpointermove=e=>{if(svg.dataset.dragging==='yes')move(e);};svg.onpointerup=()=>svg.dataset.dragging='no';svg.onpointercancel=()=>svg.dataset.dragging='no';}else{svg.onpointerdown=svg.onpointermove=svg.onpointerup=null;}
}
function advance(){if(s().step<slides[index].steps){s().step++;if(index===8&&s().step===1)s().k=11;if(index===9&&s().step===2)s().metric='manhattan';}else if(index<slides.length-1){index++;states[index]=initial(index);}else{states=slides.map((_,i)=>initial(i));index=0;}render();}
function back(){if(s().step>0){s().step--;if(index===8&&s().step===0)s().k=3;if(index===9&&s().step===1)s().metric='euclidean';}else if(index>0){index--;states[index].step=slides[index].steps;}render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('announcement').textContent='Full screen is unavailable in this browser. Open the file in a desktop browser.';}}
$('jump').innerHTML=slides.map((p,i)=>'<option value="'+i+'">'+(i+1)+'. '+p.title+'</option>').join('');$('jump').onchange=e=>{index=+e.target.value;states[index]=initial(index);render();};$('advance').onclick=advance;$('back').onclick=back;$('reset').onclick=()=>{states[index]=initial(index);render();};$('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||(e.key===' '&&['BUTTON','A'].includes(e.target.tagName)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();advance();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}else if(e.key==='Home'){e.preventDefault();index=0;states=slides.map((_,i)=>initial(i));render();}else if(e.key.toLowerCase()==='r'){states[index]=initial(index);render();}else if(e.key.toLowerCase()==='f'){fullscreen();}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,80);});
window.knnLesson={points,predict,slides,getState:()=>({index,...s()}),goTo:i=>{index=i;states[i]=initial(i);render();}};
render();
</script>
