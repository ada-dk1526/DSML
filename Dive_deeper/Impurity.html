'use strict';
const $=id=>document.getElementById(id);
const fmt=(v,n=3)=>Number(v).toFixed(n);
const pause=t=>'<p class="pause">'+t+'</p>';
const formula=t=>'<div class="formula">'+t+'</div>';
const visual=(id='plot',label='Model illustration')=>'<div class="visual"><svg id="'+id+'" class="chart" role="img" aria-label="'+label+'" viewBox="0 0 640 420"></svg></div>';
const table=(headers,rows,cls='data')=>'<table class="'+cls+'"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
function setSvg(id,markup,label='Model illustration',viewBox='0 0 640 420'){const node=$(id);if(!node)return;node.setAttribute('viewBox',viewBox);node.setAttribute('aria-label',label);node.innerHTML='<title>'+label+'</title>'+markup;}
const slides=[
{title:'Another measure of impurity',steps:2,source:'Decision tree deep dive · Gini impurity'},
{title:'How does Gini respond to class balance?',steps:3,source:'Decision tree deep dive · Binary and multiclass impurity'},
{title:'The impurity at the root',steps:2,source:'Tennis data from the tree lecture · Repaired D6'},
{title:'Weight the two Wind branches',steps:3,source:'Decision tree deep dive · Weighted impurity reduction'},
{title:'Compare the candidate roots',steps:2,source:'Same data and candidate splits as the entropy explanation'},
{title:'A good split must also be allowed',steps:2,source:'Decision tree deep dive · Stopping constraints'},
{title:'What does pruning trade off?',steps:3,source:'Decision tree deep dive · Cost-complexity pruning'},
{title:'A comparison is not a pruning path',steps:3,source:'Decision tree deep dive · Model selection and scope'}
];
const rows=[{"id": "D1", "outlook": "Sunny", "humidity": "High", "wind": "Weak", "play": "No"}, {"id": "D2", "outlook": "Sunny", "humidity": "High", "wind": "Strong", "play": "No"}, {"id": "D3", "outlook": "Overcast", "humidity": "High", "wind": "Weak", "play": "Yes"}, {"id": "D4", "outlook": "Rain", "humidity": "High", "wind": "Weak", "play": "Yes"}, {"id": "D5", "outlook": "Rain", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D6", "outlook": "Rain", "humidity": "High", "wind": "Strong", "play": "No"}, {"id": "D7", "outlook": "Overcast", "humidity": "Normal", "wind": "Strong", "play": "Yes"}, {"id": "D8", "outlook": "Sunny", "humidity": "High", "wind": "Weak", "play": "No"}, {"id": "D9", "outlook": "Sunny", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D10", "outlook": "Rain", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D11", "outlook": "Sunny", "humidity": "Normal", "wind": "Strong", "play": "Yes"}, {"id": "D12", "outlook": "Overcast", "humidity": "High", "wind": "Strong", "play": "Yes"}, {"id": "D13", "outlook": "Overcast", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D14", "outlook": "Rain", "humidity": "High", "wind": "Strong", "play": "No"}];
const blue='#4366bc',red='#c75a61',muted='#536176',ink='#17243b',line='#dce3ee';
const gini=p=>2*p*(1-p);
const rootG=gini(9/14),cross=rootG/4;
function groups(feature){const out={};rows.forEach(r=>{if(!out[r[feature]])out[r[feature]]=[];out[r[feature]].push(r);});return Object.entries(out).map(([name,r])=>{const yes=r.filter(v=>v.play==='Yes').length;return {name,n:r.length,yes,no:r.length-yes,g:gini(yes/r.length)};});}
function split(feature){const children=groups(feature);const after=children.reduce((v,c)=>v+c.n/14*c.g,0);return {feature,children,after,gain:rootG-after};}
const candidates=['wind','outlook','humidity'].map(split);
function initial(i){return {step:0,p:.5,alpha:.05};}
const text=(x,y,t,size=22,color=ink,anchor='start')=>'<text x="'+x+'" y="'+y+'" style="fill:'+color+'" font-size="'+size+'" text-anchor="'+anchor+'">'+t+'</text>';
const rule=(x1,y1,x2,y2,color=line,width=2)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="'+width+'"/>';
function giniPlot(p,showPoint,showCurve=true){let out=rule(70,340,570,340,muted)+rule(70,340,70,50,muted);for(let v=0;v<=1.001;v+=.25){out+=text(70+500*v,367,fmt(v,2),16,muted,'middle');}for(let v=0;v<=.501;v+=.1)out+=text(57,345-560*v,fmt(v,1),16,muted,'end');let d='';for(let j=0;j<=100;j++){const q=j/100;d+=(j?'L':'M')+(70+500*q)+','+(340-560*gini(q))+' ';}if(showCurve)out+='<path d="'+d+'" fill="none" stroke="'+blue+'" stroke-width="4"/>';out+=text(320,405,'Proportion Yes, p',20,ink,'middle')+text(85,35,'Gini impurity',20);if(showPoint)out+=rule(70+500*p,340,70+500*p,340-560*gini(p),red)+ '<circle cx="'+(70+500*p)+'" cy="'+(340-560*gini(p))+'" r="7" fill="'+red+'"/>';setSvg('plot',out,'Gini impurity versus the proportion of Yes labels');}
function pruningPlot(alpha,show){let out=rule(70,340,570,340,muted)+rule(70,340,70,45,muted);const px=v=>70+2500*v,py=v=>340-270*v;for(let v=0;v<=.201;v+=.05)out+=text(px(v),366,fmt(v,2),16,muted,'middle');for(let v=0;v<=1.001;v+=.25)out+=text(58,py(v)+6,fmt(v,2),16,muted,'end');out+=text(320,405,'Complexity penalty α',20,ink,'middle')+text(85,28,'Penalised cost Rα',20);if(show){out+=rule(px(0),py(0),px(.2),py(1),blue,4)+rule(px(0),py(rootG),px(.2),py(rootG+.2),red,4)+rule(px(alpha),340,px(alpha),50,'#8e99a9',1);out+=text(365,85,'Five pure leaves',18,blue)+text(365,113,'Root only',18,red);out+='<circle cx="'+px(alpha)+'" cy="'+py(5*alpha)+'" r="6" fill="'+blue+'"/><circle cx="'+px(alpha)+'" cy="'+py(rootG+alpha)+'" r="6" fill="'+red+'"/>';}setSvg('plot',out,'Penalised cost for two fixed candidate trees');}
function updateP(st){$('pvalue').textContent=fmt(st.p,2);$('gvalue').textContent=fmt(gini(st.p),3);giniPlot(st.p,true);}
function updateAlpha(st){$('avalue').textContent=fmt(st.alpha,3);$('fivecost').textContent=fmt(5*st.alpha,3);$('onecost').textContent=fmt(rootG+st.alpha,3);$('winner').textContent=Math.abs(st.alpha-cross)<1e-10?'The two candidates tie.':st.alpha<cross?'Lower cost: five pure leaves.':'Lower cost: root only.';pruningPlot(st.alpha,true);}
function content(i,t,st){let left='',right='',after=()=>{};
 if(i===0){left=table(['Tennis observations','Count'],[['Yes','9'],['No','5'],['Total','14']])+'<p class="data-caption">Same repaired data as the tree lecture: D6 is Rain / High / Strong / No.</p>';right=pause('Would a different impurity measure select the same root?');if(t>=1)right+=formula('G = 1 − ∑<sub>c</sub> p<sub>c</sub>²');if(t>=2)right+='<p>We will compare the same candidate splits, then ask when to stop growing.</p><p class="small"><a href="../Decision_Trees/Decision_Trees_Interactive_Presentation.html">Revisit the tree lecture</a></p>';}
 if(i===1){left=visual();right=pause('Predict the impurity at p = 0, ½ and 1. What changes when Yes and No swap?');if(t>=1)right+=formula('G(p) = 1 − p² − (1 − p)²<br>= 2p(1 − p)');if(t>=2)right+='<div class="controls"><label for="p">Proportion Yes <input id="p" type="range" min="0" max="1" step=".05" value="'+st.p+'"> <output id="pvalue"></output></label></div><p>Gini = <strong id="gvalue"></strong></p>';if(t>=3)right+='<p class="small">Binary range: 0 to ½. For K classes: 0 to 1 − 1/K; the maximum occurs at equal proportions.</p>';after=()=>{giniPlot(t>=2?st.p:.5,t>=2,t>=1);if(t>=2){updateP(st);$('p').oninput=e=>{st.p=+e.target.value;updateP(st);};}};}
 if(i===2){left=table(['Class','Proportion'],[['Yes','9/14'],['No','5/14']]);right=pause('Is this root more or less impure than a 7–7 node?');if(t>=1)right+=formula('G(root) = 1 − (9/14)² − (5/14)²');if(t>=2)right+=formula('= 90/196 ≈ <strong>0.4592</strong>')+'<p>Less than 0.5: the classes are not equally frequent.</p>';}
 if(i===3){const wind=candidates[0];left=table(['Wind','Yes','No','Gini'],wind.children.map(c=>[c.name,c.yes,c.no,t>=1?fmt(c.g,3):'?']));right=pause('Which branch is purer? Should the two branch impurities receive equal weight?');if(t>=1)right+=formula('G(Weak) = 0.375<br>G(Strong) = 0.500');if(t>=2)right+=formula('G<sub>after</sub> = (8/14)·0.375 + (6/14)·0.500<br>≈ 0.4286');if(t>=3)right+='<p>Gini decrease = 0.4592 − 0.4286<br><strong>≈ 0.0306</strong></p>';}
 if(i===4){left=table(['Root split','Weighted Gini','Decrease'],candidates.map(c=>[c.feature[0].toUpperCase()+c.feature.slice(1),t>=1?fmt(c.after,4):'?',t>=1?fmt(c.gain,4):'?']));right=pause('Which split gives the largest reduction? Compare your choice with the entropy result.');if(t>=1)right+='<p><strong>Humidity</strong> gives the greatest Gini decrease.</p>';if(t>=2)right+='<p>Both criteria rank these splits:<br>Humidity → Outlook → Wind.</p><p class="small">Agreement on this dataset is not a general equivalence between Gini and entropy.</p>';}
 if(i===5){left=table(['Candidate root','Child sizes'],[['Wind','8, 6'],['Outlook','5, 4, 5'],['Humidity','8, 6']]);right=pause('Require at least 7 observations in every child. Which of these candidate splits is allowed?');if(t>=1)right+='<p><strong>None.</strong> Every candidate creates a child with fewer than 7 observations.</p>';if(t>=2)right+='<p>Keep a root leaf predicting Yes.</p><p class="small">Depth, minimum leaf size and minimum impurity decrease restrict growth before a split is made. The criterion ranks only eligible splits.</p>';}
 if(i===6){left=visual();right=pause('As α increases, which of two fixed trees becomes more attractive?');if(t>=1)right+=formula('R(T) = ∑<sub>leaves ℓ</sub> (n<sub>ℓ</sub>/14) G(ℓ)<br>R<sub>α</sub>(T) = R(T) + α · leaves(T)');if(t>=2)right+=table(['Candidate','R(T)','Rα'],[['Five pure leaves','0','5α'],['Root only','90/196','90/196 + α']]);if(t>=3)right+='<div class="controls"><label for="alpha">α <input id="alpha" type="range" min="0" max=".2" step=".005" value="'+st.alpha+'"> <output id="avalue"></output></label></div><p class="small">Five leaves: <b id="fivecost"></b> · Root: <b id="onecost"></b><br><strong id="winner"></strong></p>';after=()=>{pruningPlot(st.alpha,t>=2);if(t>=3){updateAlpha(st);$('alpha').oninput=e=>{st.alpha=+e.target.value;updateAlpha(st);};}};}
 if(i===7){left='<div class="equation">5α = 90/196 + α</div>';if(t>=1)left+='<div class="equation">α* = (90/196) / 4<br>≈ 0.1148</div><p class="data-caption">The crossover applies to these two fixed candidates.</p>';right=pause('Have we identified the best pruned subtree at every value of α?');if(t>=1)right+='<p>We have found where the two endpoints tie.</p>';if(t>=2)right+='<p><strong>Intermediate subtrees may beat both.</strong> They were not searched in this comparison.</p>';if(t>=3)right+='<p class="small">Choose complexity using validation. Here R(T) is weighted leaf Gini, not accuracy or misclassification rate.</p><p><strong>Takeaway:</strong> the criterion, allowed splits and complexity choice play different roles.</p>';}
 return {left:'<div class="lesson-visual">'+left+'</div>',right,after};
}
window.lessonModel={rows,gini,rootG,cross,candidates};


let index=0,states=slides.map((_,i)=>initial(i));
const s=()=>states[index];
const maximum=()=>typeof slideSteps==='function'?slideSteps(index,s()):slides[index].steps;
function render(){
 const focus=document.activeElement&&document.activeElement.id;
 $('slide-title').textContent=slides[index].title;$('source').textContent=slides[index].source||'';
 const part=content(index,s().step,s());
 $('stage').innerHTML=part.html!==undefined?part.html:(part.left||'')+'<section class="copy">'+(part.right||'')+'</section>';
 if(part.after)part.after();
 $('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+maximum();$('jump').value=index;
 $('back').disabled=index===0&&s().step===0;$('advance').textContent=s().step<maximum()?'Reveal next':index<slides.length-1?'Next slide':'Start again';
 $('progress').style.width=100*(index+s().step/Math.max(1,maximum()))/slides.length+'%';
 $('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+maximum();
 if(focus&&$(focus)&&!['jump','advance','back','reset'].includes(focus))$(focus).focus({preventScroll:true});
}
const refresh=()=>render();
function advance(){if(s().step<maximum())s().step++;else if(index<slides.length-1){index++;states[index]=initial(index);}else{index=0;states=slides.map((_,i)=>initial(i));}render();}
function back(){if(s().step>0)s().step--;else if(index>0){index--;s().step=maximum();}render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('announcement').textContent='Open this file in a desktop browser to use full screen.';}}
$('jump').innerHTML=slides.map((v,i)=>'<option value="'+i+'">'+(i+1)+'. '+v.title+'</option>').join('');
$('jump').onchange=e=>{index=+e.target.value;states[index]=initial(index);render();};$('advance').onclick=advance;$('back').onclick=back;$('reset').onclick=()=>{states[index]=initial(index);render();};$('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||(e.key===' '&&['BUTTON','A'].includes(e.target.tagName)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();advance();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}else if(e.key==='Home'){e.preventDefault();index=0;states=slides.map((_,i)=>initial(i));render();}else if(e.key.toLowerCase()==='r'){states[index]=initial(index);render();}else if(e.key.toLowerCase()==='f')fullscreen();});
window.lesson={slides,getState:()=>({index,...s()}),maximum,advance,back,render,goTo:i=>{index=i;states[i]=initial(i);render();}};
render();
</script></body></html>
