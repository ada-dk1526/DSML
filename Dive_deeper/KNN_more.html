'use strict';
const $=id=>document.getElementById(id);
const fmt=(v,n=3)=>Number(v).toFixed(n);
const pause=t=>'<p class="pause">'+t+'</p>';
const formula=t=>'<div class="formula">'+t+'</div>';
const visual=(id='plot',label='Model illustration')=>'<div class="visual"><svg id="'+id+'" class="chart" role="img" aria-label="'+label+'" viewBox="0 0 640 420"></svg></div>';
const table=(headers,rows,cls='data')=>'<table class="'+cls+'"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
function setSvg(id,markup,label='Model illustration',viewBox='0 0 640 420'){const node=$(id);if(!node)return;node.setAttribute('viewBox',viewBox);node.setAttribute('aria-label',label);node.innerHTML='<title>'+label+'</title>'+markup;}
const points=[{id:'B1',x:1,y:1.2,c:0},{id:'B2',x:1,y:2.2,c:0},{id:'B3',x:1.5,y:3.2,c:0},{id:'B4',x:2,y:2.5,c:0},{id:'B5',x:2,y:1,c:0},{id:'R1',x:3.4,y:3.6,c:0},{id:'R2',x:3.8,y:4.8,c:1},{id:'R3',x:4.4,y:4.1,c:1},{id:'R4',x:4.5,y:3,c:1},{id:'R5',x:5.2,y:3.8,c:1},{id:'R6',x:5.4,y:4.8,c:1}];
function neighbours(q,k=3){return points.map((p,i)=>({...p,i,d:Math.hypot(p.x-q[0],p.y-q[1])})).sort((a,b)=>Math.abs(a.d-b.d)<1e-10?a.i-b.i:a.d-b.d).slice(0,k);}
function weightedVote(q,mode='distance'){const near=neighbours(q),zero=near.filter(p=>p.d<1e-10),use=mode==='distance'&&zero.length?zero:near;const weights=use.map(p=>mode==='uniform'||zero.length?1:1/p.d);let scores=[0,0];use.forEach((p,i)=>scores[p.c]+=weights[i]);return{near,use,weights,scores,prediction:scores[1]>scores[0]?'Red':'Blue',zero:zero.length>0};}
const regression=[{x:0,y:1},{x:2,y:5},{x:5,y:2}];
function localRegression(q,mode='uniform',h=1){const near=regression.map((p,i)=>({...p,i,d:Math.abs(p.x-q)})).sort((a,b)=>a.d-b.d||a.i-b.i).slice(0,2);let use=mode==='gaussian'?regression:near,weights=use.map(p=>mode==='uniform'?1:mode==='gaussian'?Math.exp(-.5*((p.x-q)/h)**2):p.d<1e-10?Infinity:1/p.d);if(weights.some(v=>!Number.isFinite(v))){use=use.filter((p,i)=>!Number.isFinite(weights[i]));weights=use.map(()=>1);}const sum=weights.reduce((a,b)=>a+b,0),prediction=use.reduce((v,p,i)=>v+weights[i]*p.y,0)/sum;return{near,use,weights,prediction};}
const minkowski=p=>(3**p+4**p)**(1/p),kl=(p,q)=>p.reduce((v,a,i)=>a===0?v:q[i]===0?Infinity:v+a*Math.log(a/q[i]),0);
const slides=[
{title:'Inside the neighbourhood',steps:1,source:'KNN notes, pp2–4 · Continuation of the first KNN presentation'},
{title:'One neighbour can outweigh two',steps:3,source:'Classification mathematics · Weighted KNN · Class-indicator notation clarified'},
{title:'What if the distance is zero?',steps:2,source:'KNN notes, p4 · Added explicit zero-distance convention'},
{title:'Neighbours can predict a number',steps:3,source:'KNN notes, p2 · Three-point regression illustration added'},
{title:'Move beyond the observed inputs',steps:2,source:'KNN notes, p2 · Weighted-mean interpretation'},
{title:'Fixed count or fixed radius?',steps:2,source:'KNN notes, p4 · Local neighbourhood definitions'},
{title:'Smooth weights, different mechanism',steps:2,source:'KNN notes, p4 · Kernel-weighted averaging'},
{title:'Which quantities define a distance?',steps:2,source:'KNN notes, p3 · Minkowski and Hamming definitions clarified'},
{title:'A dissimilarity need not be a metric',steps:2,source:'Optional · KNN notes, p3 · KL divergence formula corrected'},
{title:'Where does the computation happen?',steps:2,source:'KNN notes, p5 · Storage and query-cost claims corrected'},
{title:'Explain the neighbourhood rule',steps:2,source:'KNN notes, pp1–5 and Classification mathematics · KNN'}
];
function initial(i){return{step:0,mode:'uniform',q:1.8,region:'original',h:1,p:2,n:1000,d:10};}
function slider(label,id,value,min,max,step){return '<div class="controls"><label><span>'+label+'</span><input type="range" id="'+id+'" value="'+value+'" min="'+min+'" max="'+max+'" step="'+step+'"><output id="'+id+'-value">'+value+'</output></label></div>';}
function scatter(id,q,chosen=[],radius=null){const X=x=>75+x*70,Y=y=>395-y*70;let h='<rect x="75" y="45" width="420" height="350" fill="none" stroke="#a8b8c4"/>';for(let x=0;x<=6;x++)h+='<text class="tick" x="'+X(x)+'" y="417" text-anchor="middle">'+x+'</text>';for(let y=0;y<=5;y++)h+='<text class="tick" x="60" y="'+(Y(y)+5)+'" text-anchor="end">'+y+'</text>';h+='<defs><clipPath id="clipplot"><rect x="75" y="45" width="420" height="350"/></clipPath></defs>';if(radius!==null)h+='<ellipse cx="'+X(q[0])+'" cy="'+Y(q[1])+'" rx="'+radius*70+'" ry="'+radius*70+'" fill="#eaf0f6" stroke="#657f95" stroke-dasharray="5 4" clip-path="url(#clipplot)"/>';points.forEach(p=>{if(chosen.includes(p.id))h+='<line x1="'+X(q[0])+'" y1="'+Y(q[1])+'" x2="'+X(p.x)+'" y2="'+Y(p.y)+'" stroke="#8c9eac" stroke-dasharray="4 3"/><circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="15" fill="none" stroke="#183349"/>';h+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="7" fill="'+(p.c?'#bc3c4b':'#2463b7')+'"/><text class="point-label" x="'+(X(p.x)+11)+'" y="'+(Y(p.y)+(p.y>4.5?21:-10))+'">'+p.id+'</text>';});h+='<path d="M'+(X(q[0])-9)+' '+Y(q[1])+'h18M'+X(q[0])+' '+(Y(q[1])-9)+'v18" stroke="#183349" stroke-width="3"/>';setSvg(id,h,'Training observations and selected neighbours','0 0 600 440');}
function regressionPlot(id,q,mode='uniform',show=true,h=1){const X=x=>75+(x+1)*65,Y=y=>360-y*50;let html='<path d="M75 50V360H595" fill="none" stroke="#94a8b9"/>';regression.forEach(p=>{html+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="8" fill="#2463b7"/><text class="point-label" x="'+(X(p.x)+12)+'" y="'+(Y(p.y)-10)+'">('+p.x+', '+p.y+')</text>';});for(let x=-1;x<=7;x++)html+='<text class="tick" x="'+X(x)+'" y="385" text-anchor="middle">'+x+'</text>';[0,1,2,3,4,5,6].forEach(y=>html+='<text class="tick" x="59" y="'+(Y(y)+5)+'" text-anchor="end">'+y+'</text>');html+='<text class="axis" x="325" y="420" text-anchor="middle">Input x</text>';if(show){const r=localRegression(q,mode,h);html+='<path d="M'+X(q)+' 360V'+Y(r.prediction)+'" stroke="#16704e" stroke-dasharray="5 4"/><circle cx="'+X(q)+'" cy="'+Y(r.prediction)+'" r="8" fill="#16704e"/><text class="point-label" x="'+(X(q)+(q>5?-12:12))+'" text-anchor="'+(q>5?'end':'start')+'" y="'+(Y(r.prediction)+26)+'">ŷ = '+fmt(r.prediction,2)+'</text>';}setSvg(id,html,'Three regression observations and a local mean prediction','0 0 650 440');}
function weightCurve(id,h){let html='<path d="M70 55V345H570" fill="none" stroke="#94a8b9"/>';const X=x=>320+x*80,Y=w=>345-w*270;let path='';for(let i=0;i<=120;i++){const d=-3+i*.05;path+=(i?'L':'M')+X(d)+' '+Y(Math.exp(-.5*(d/h)**2));}html+='<path d="'+path+'" fill="none" stroke="#2463b7" stroke-width="3"/>';[-3,-2,-1,0,1,2,3].forEach(x=>html+='<text class="tick" x="'+X(x)+'" y="375" text-anchor="middle">'+x+'</text>');html+='<text class="axis" x="320" y="415" text-anchor="middle">Signed distance from the query</text><text class="label" x="320" y="40" text-anchor="middle">Gaussian weight</text>';setSvg(id,html,'Gaussian neighbourhood weight as a function of distance');}
function content(i,t,st){let left=visual(),right='',after;
if(i===0){right='<p class="lead">Must two votes defeat one?</p><p>Use q = (3.4, 3.7), k = 3. As in the earlier label-change demonstration, <strong>R1 now has the Blue label</strong>.</p>'+pause('Predict the uniform vote. Could giving closer neighbours more weight change it?')+(t?'<p>We will keep the points and selected neighbours fixed while changing the vote rule.</p>':'<p class="muted">15–20 minutes · Prerequisite: the first KNN presentation.</p>');after=()=>scatter('plot',[3.4,3.7],t?neighbours([3.4,3.7]).map(p=>p.id):[]);}
if(i===1){const r=weightedVote([3.4,3.7],'distance');left=table(['Neighbour','Class','Distance','1 / distance'],r.near.map(p=>[p.id,p.c?'Red':'Blue',t?fmt(p.d):'?',t>=2?fmt(1/p.d):'?']));right=t===0?pause('Calculate each distance, then each inverse-distance weight.'):formula('Score(c) = Σᵢ 𝟙(yᵢ = c) / dᵢ')+(t>=2?'<p>Uniform vote: <span class="red">Red wins 2 to 1</span>.</p>':'')+(t>=3?'<p>Weighted Blue score = <strong>10</strong>.<br>Weighted Red score ≈ <strong>'+fmt(r.scores[1])+'</strong>.</p><p class="answer blue">Weighted prediction: Blue</p><p class="correction">Use a class indicator for each vote. Multiplying by a numeric class label would incorrectly give class 0 no influence.</p>':'');}
if(i===2){right='<p>Move the query exactly onto R1.</p>'+(t===0?pause('What happens to 1/d? State a rule before evaluating it.'):formula('If any selected distances are zero:<br>use only those exact matches.'))+(t>=2?'<p>R1 is the only exact match here, so the prediction is Blue.</p><p class="muted">With conflicting duplicate labels, this demonstration uses equal votes among the exact matches, then Blue for an exact vote tie. Other implementations need an explicit convention too.</p>':'');after=()=>scatter('plot',[3.4,3.6],t?['R1']:[]);}
if(i===3){right='<p>New regression illustration: (0,1), (2,5), (5,2). Query x = 1.8, k = 2.</p>'+(t===0?pause('Which targets enter the prediction? What changes if their distances become weights?'):formula('Uniform: ŷ = (5 + 1)/2 = 3'))+(t>=2?formula('Distance-weighted:<br>ŷ = (5/0.2 + 1/1.8) / (1/0.2 + 1/1.8)'):'')+(t>=3?'<p class="answer">ŷ = 4.6</p><p>The closer observation pulls the weighted mean towards 5.</p>':'');after=()=>regressionPlot('plot',1.8,t>=2?'distance':'uniform',t>0);}
if(i===4){right=t===0?'<p>Keep the same three training observations.</p>'+pause('If the query moves beyond x=5, can a nonnegative weighted average predict above y=5?'):slider('Query x','query',st.q,-1,7,.1)+'<div class="controls"><label for="mode">Averaging rule</label><select id="mode"><option value="uniform" '+(st.mode==='uniform'?'selected':'')+'>Uniform, k = 2</option><option value="distance" '+(st.mode==='distance'?'selected':'')+'>Inverse distance, k = 2</option></select></div><div id="live" aria-live="polite"></div>'+(t>=2?'<p>These predictions stay inside the range of selected targets. They cannot continue a trend beyond that range.</p><p class="muted">Uniform-neighbour means change in steps as the selected set changes.</p>':'');after=()=>{function update(){const r=localRegression(st.q,st.mode);regressionPlot('plot',st.q,st.mode,t>0);if($('live'))$('live').innerHTML='<p class="answer">ŷ = '+fmt(r.prediction,2)+'</p>';}update();if($('query'))$('query').oninput=e=>{st.q=+e.target.value;$('query-value').textContent=fmt(st.q,1);update();};if($('mode'))$('mode').onchange=e=>{st.mode=e.target.value;update();};};}

let index=0,states=slides.map((_,i)=>initial(i));
const s=()=>states[index];
const maximum=()=>typeof slideSteps==='function'?slideSteps(index,s()):slides[index].steps;
function render(){
 const focus=document.activeElement&&document.activeElement.id;
 $('slide-title').textContent=slides[index].title;$('source').textContent=slides[index].source||'';
 const part=content(index,s().step,s());
 $('stage').innerHTML=part.html!==undefined?part.html:(part.left||'')+'<section class="copy">'+(part.right||'')+'</section>';
 if(part.after)part.after();
 $('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+maximum();$('jump').value=index;
 $('back').disabled=index===0&&s().step===0;$('advance').textContent=s().step<maximum()?'Reveal next':index<slides.length-1?'Next slide':'Start again';
 $('progress').style.width=100*(index+s().step/Math.max(1,maximum()))/slides.length+'%';
 $('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+maximum();
 if(focus&&$(focus)&&!['jump','advance','back','reset'].includes(focus))$(focus).focus({preventScroll:true});
}
const refresh=()=>render();
function advance(){if(s().step<maximum())s().step++;else if(index<slides.length-1){index++;states[index]=initial(index);}else{index=0;states=slides.map((_,i)=>initial(i));}render();}
function back(){if(s().step>0)s().step--;else if(index>0){index--;s().step=maximum();}render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('announcement').textContent='Open this file in a desktop browser to use full screen.';}}
$('jump').innerHTML=slides.map((v,i)=>'<option value="'+i+'">'+(i+1)+'. '+v.title+'</option>').join('');
$('jump').onchange=e=>{index=+e.target.value;states[index]=initial(index);render();};$('advance').onclick=advance;$('back').onclick=back;$('reset').onclick=()=>{states[index]=initial(index);render();};$('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||(e.key===' '&&['BUTTON','A'].includes(e.target.tagName)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();advance();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}else if(e.key==='Home'){e.preventDefault();index=0;states=slides.map((_,i)=>initial(i));render();}else if(e.key.toLowerCase()==='r'){states[index]=initial(index);render();}else if(e.key.toLowerCase()==='f')fullscreen();});
window.lesson={slides,getState:()=>({index,...s()}),maximum,advance,back,render,goTo:i=>{index=i;states[i]=initial(i);render();}};
