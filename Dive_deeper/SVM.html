'use strict';
const $=id=>document.getElementById(id);
const fmt=(v,n=3)=>Number(v).toFixed(n);
const pause=t=>'<p class="pause">'+t+'</p>';
const formula=t=>'<div class="formula">'+t+'</div>';
const visual=(id='plot',label='Model illustration')=>'<div class="visual"><svg id="'+id+'" class="chart" role="img" aria-label="'+label+'" viewBox="0 0 640 420"></svg></div>';
const table=(headers,rows,cls='data')=>'<table class="'+cls+'"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
function setSvg(id,markup,label='Model illustration',viewBox='0 0 640 420'){const node=$(id);if(!node)return;node.setAttribute('viewBox',viewBox);node.setAttribute('aria-label',label);node.innerHTML='<title>'+label+'</title>'+markup;}
const svmData=[{x:-2,y:-1},{x:-1,y:-1},{x:1,y:1},{x:2,y:1}];
const hinge=m=>Math.max(0,1-m);
function objective(w,b,C,changed=false){const losses=svmData.map((p,i)=>hinge((changed&&i===1?1:p.y)*(w*p.x+b)));return{losses,sum:losses.reduce((a,b)=>a+b,0),penalty:w*w/2,total:w*w/2+C*losses.reduce((a,b)=>a+b,0)};}
const rbf=(distance,sigma)=>Math.exp(-distance*distance/(2*sigma*sigma));
const slides=[
{title:'Support vector machines',steps:1,source:'Classification mathematics · SVM: margin objective · Added four-point illustration'},
{title:'A boundary needs a scale convention',steps:2,source:'Classification mathematics · Hard-margin constraints'},
{title:'Measure the margin',steps:2,source:'Classification mathematics · Margin distance'},
{title:'Which feasible boundary wins?',steps:2,source:'Classification mathematics · Hard-margin primal objective'},
{title:'Correct classification is not enough',steps:2,source:'Classification mathematics · Hinge loss'},
{title:'One changed label',steps:2,source:'Classification mathematics · Soft-margin motivation · Added perturbation'},
{title:'Compare two soft-margin candidates',steps:3,source:'Classification mathematics · Soft-margin objective'},
{title:'What C controls',steps:2,source:'Classification mathematics · Soft margin · Candidate comparison, not a full fit'},
{title:'From slack variables to hinge loss',steps:2,source:'Classification mathematics · Soft-margin constraints'},
{title:'Only some observations contribute',steps:3,source:'Optional · Classification mathematics · Dual formulation'},
{title:'A kernel changes the feature space',steps:3,source:'Classification mathematics · Kernel trick · Added one-dimensional example'},
{title:'RBF similarity has a length scale',steps:2,source:'Classification mathematics · Gaussian kernel'},
{title:'Explain the SVM decision',steps:2,source:'Classification mathematics · SVM · Connect to the Day 5 lecture'}
];
function initial(i){return{step:0,w:1,b:0,margin:.4,C:.25,sigma:1};}
function controls(label,id,value,min,max,step){return '<div class="controls"><label><span>'+label+'</span><input id="'+id+'" type="range" value="'+value+'" min="'+min+'" max="'+max+'" step="'+step+'"><output id="'+id+'-value">'+value+'</output></label></div>';}
function drawLine(id,w=1,b=0,changed=false,showMargin=false){let h='';const X=x=>70+(x+3)*83,Y=205;h+='<line x1="70" y1="205" x2="568" y2="205" stroke="#9aabb9"/>';for(let x=-3;x<=3;x++)h+='<text class="tick" x="'+X(x)+'" y="342" text-anchor="middle">'+x+'</text>';h+='<text class="axis" x="320" y="408" text-anchor="middle">Input x</text>';if(showMargin){const a=(-1-b)/w,c=(1-b)/w;h+='<rect x="'+X(a)+'" y="105" width="'+(X(c)-X(a))+'" height="200" fill="#e7eef5"/><line x1="'+X(a)+'" y1="105" x2="'+X(a)+'" y2="305" stroke="#647e96" stroke-dasharray="5 5"/><line x1="'+X(c)+'" y1="105" x2="'+X(c)+'" y2="305" stroke="#647e96" stroke-dasharray="5 5"/>';}h+='<line x1="'+X(-b/w)+'" y1="80" x2="'+X(-b/w)+'" y2="320" stroke="#183349" stroke-width="2.5"/><text class="label" x="'+X(-b/w)+'" y="55" text-anchor="middle">f(x) = 0</text>';svmData.forEach((p,i)=>{const y=changed&&i===1?1:p.y;h+='<circle cx="'+X(p.x)+'" cy="205" r="22" fill="'+(y===1?'#2463b7':'#bc3c4b')+'"/><text x="'+X(p.x)+'" y="211" text-anchor="middle" style="fill:white;font-size:18px">'+(y===1?'+1':'−1')+'</text>';});h+='<text class="label" x="320" y="365" text-anchor="middle">Score: f(x) = '+w+'x '+(b<0?'− '+(-b):'+ '+b)+'</text>';setSvg(id,h,'One-dimensional labelled observations and the SVM boundary');}
function drawHinge(id,m,show=true){let h='<path d="M70 65V345H570" fill="none" stroke="#8d9eab"/>';const X=x=>70+(x+2)*100,Y=y=>345-y*80;for(let x=-2;x<=3;x++)h+='<text class="tick" x="'+X(x)+'" y="370" text-anchor="middle">'+x+'</text>';h+='<text class="axis" x="320" y="410" text-anchor="middle">Signed score m = y f(x)</text>';for(let y=0;y<=3;y++)h+='<text class="tick" x="55" y="'+(Y(y)+5)+'" text-anchor="end">'+y+'</text>';if(show)h+='<path d="M'+X(-2)+' '+Y(3)+'L'+X(1)+' '+Y(0)+'H'+X(3)+'" stroke="#2463b7" stroke-width="3" fill="none"/><circle cx="'+X(m)+'" cy="'+Y(hinge(m))+'" r="7" fill="#16704e"/>';setSvg(id,h,'Hinge loss against signed model score');}
function kernelPlot(id,lift=false){const pts=[-2,0,2];let h='<path d="M70 60V345H575" fill="none" stroke="#8d9eab"/>';pts.forEach(x=>{const px=320+x*105,py=lift?330-x*x*55:220;h+='<circle cx="'+px+'" cy="'+py+'" r="20" fill="'+(x===0?'#bc3c4b':'#2463b7')+'"/><text x="'+px+'" y="'+(py+6)+'" style="fill:white;font-size:18px" text-anchor="middle">'+(x===0?'−1':'+1')+'</text><text class="tick" x="'+px+'" y="375" text-anchor="middle">'+x+'</text>';});if(lift)h+='<line x1="80" y1="275" x2="565" y2="275" stroke="#183349" stroke-dasharray="5 4"/><text class="label" x="525" y="257" text-anchor="end">x² = 1</text>';h+='<text class="axis" x="320" y="410" text-anchor="middle">x</text>';if(lift)h+='<text class="axis" x="45" y="60">x²</text>';setSvg(id,h,lift?'Lifted x squared separates the middle point from the outer points':'One raw threshold cannot separate both positive outer points');}
function rbfPlot(id,sigma){let h='<path d="M70 60V345H575" fill="none" stroke="#8d9eab"/>';const X=x=>70+x*160,Y=y=>345-y*270;for(let x=0;x<=3;x++)h+='<text class="tick" x="'+X(x)+'" y="375" text-anchor="middle">'+x+'</text>';let d='';for(let i=0;i<=150;i++){const x=i/50;d+=(i?'L':'M')+X(x)+' '+Y(rbf(x,sigma));}h+='<path d="'+d+'" fill="none" stroke="#2463b7" stroke-width="3"/><text class="axis" x="320" y="410" text-anchor="middle">Distance between inputs</text><text class="tick" x="55" y="80" text-anchor="end">1</text><text class="label" x="310" y="45" text-anchor="middle">Kernel similarity</text>';setSvg(id,h,'Gaussian kernel similarity as distance changes');}
function content(i,t,st){let left=visual(),right='',after;
if(i===0){right='<p class="lead">Many thresholds classify these four points correctly.</p>'+pause('Which boundary should the model prefer, and how would you measure that preference?')+(t?'<p>We will compare the distance to the nearest observations on either side.</p>':'<p class="muted">20–25 minutes · One input feature<br>Labels are −1 and +1.</p>');after=()=>drawLine('plot');}
if(i===1){left=table(['Input x','Label y','f(x)=x','f(x)=½x'],svmData.map(p=>[p.x,p.y,p.x,p.x/2]));right=t===0?pause('These scores produce the same class labels. Are they equally feasible under y f(x) ≥ 1?'):formula('yᵢ(w xᵢ + b) ≥ 1')+(t>=2?'<p>The scores x satisfy every constraint. The scores ½x fail at x = ±1.</p><p class="muted">Rescaling a score leaves its zero boundary unchanged. The unit constraints fix the scale used to define the margin.</p>':pause('Check the signed score at each observation.'));}
if(i===2){right=t===0?pause('For w = 1 and b = 0, locate f(x) = −1, 0 and +1. What are the two margin widths?'):formula('f(x) = ±1 ⇒ x = (±1 − b)/w')+(t>=2?'<p>Each margin plane is <strong>1/|w|</strong> from the decision boundary.</p><p>The full band has width <strong>2/|w| = 2</strong>.</p><p class="correction">The notes use “margin” for both distances. Here we distinguish the one-sided distance and full band width.</p>':'');after=()=>drawLine('plot',1,0,false,t>0);}
if(i===3){left=table(['Candidate','w, b','½w²','Full band'],[['A','1, 0',t?'0.5':'?',t?'2':'?'],['B','2, 1',t?'2':'?',t?'1':'?']]);right='<p>Both candidates satisfy all four hard-margin constraints.</p>'+(t===0?pause('Which objective value is smaller? Which feasible margin band is wider?'):formula('min ½‖w‖², subject to yᵢ f(xᵢ) ≥ 1')+(t>=2?'<p class="answer">Candidate A wins this comparison.</p><p>In this example, x = −1 and x = +1 constrain its margin.</p>':''));}
if(i===4){right=t===0?'<p>A positive observation has f(x) = 0.4.</p>'+pause('It is classified correctly. Does it have zero hinge loss?'):formula('ℓ = max(0, 1 − y f(x))')+(t>=2?controls('Signed score','margin',st.margin,-2,3,.1)+'<div id="live" aria-live="polite"></div>':'<p>At signed score 0.4, the loss is 0.6.</p>');after=()=>{drawHinge('plot',st.margin,t>0);if($('margin')){$('margin').oninput=e=>{st.margin=+e.target.value;$('margin-value').textContent=fmt(st.margin,1);drawHinge('plot',st.margin);updateHinge();};updateHinge();}};function updateHinge(){$('live').innerHTML='<p class="answer">Hinge loss = '+fmt(hinge(st.margin),1)+'</p><p class="small">'+(st.margin<0?'Wrong side of the decision boundary.':st.margin===0?'On the decision boundary; class assignment needs a tie convention.':st.margin<1?'Correct side, inside the unit margin.':'At or beyond the unit margin.')+'</p>';}}
if(i===5){right='<p>Change only the label at <strong>x = −1</strong> to +1.</p>'+(t===0?pause('For the unchanged score f(x)=x, which hinge losses change?'):table(['x','Signed score','Hinge loss'],svmData.map((p,j)=>[p.x,(j===1?1:p.y)*p.x,hinge((j===1?1:p.y)*p.x)])))+(t>=2?'<p>The changed observation has loss 2. A soft-margin objective can trade that violation against a larger weight.</p>':'');after=()=>drawLine('plot',1,0,t>0,true);}
if(i===6){left=table(['Candidate','Score','½w²','Σ hinge'],[['A','x',t?'0.5':'?',t?'2':'?'],['B','2x + 3',t?'2':'?',t?'0':'?']]);right='<p>Use the changed label at x = −1.</p>'+(t===0?pause('Compare a smaller weight with a boundary that satisfies every unit margin.'):formula('J = ½‖w‖² + C Σᵢ max(0, 1 − yᵢ f(xᵢ))'))+(t>=2?formula('J(A) = 0.5 + 2C<br>J(B) = 2'):'')+(t>=3?'<p>At C = 0.25: A costs 1, B costs 2.<br>At C = 1: A costs 2.5, B costs 2.</p><p class="muted">These are two specified candidates, not a search over all possible parameters.</p>':'');}
if(i===7){left='<div>'+table(['Candidate','Cost'],[['A: f(x)=x','<span id="costA">…</span>'],['B: f(x)=2x+3','<span id="costB">…</span>']])+'</div>';right=t===0?pause('At what value of C do the two candidate costs become equal?'):formula('0.5 + 2C = 2 ⇒ C = 0.75')+(t>=2?controls('C','C',st.C,.05,2,.05)+'<div id="live" aria-live="polite"></div><p class="muted">Larger C gives violations more weight relative to ½‖w‖². It does not change the hinge-loss definition.</p>':'');after=()=>{function update(){$('costA').textContent=fmt(objective(1,0,st.C,true).total,2);$('costB').textContent='2.00';if($('live'))$('live').innerHTML='<p class="answer">'+(Math.abs(st.C-.75)<1e-9?'Equal costs':st.C<.75?'Candidate A costs less':'Candidate B costs less')+'</p>';}if(t)update();if($('C'))$('C').oninput=e=>{st.C=+e.target.value;$('C-value').textContent=fmt(st.C,2);update();};};}
if(i===8){left=table(['Signed score','Smallest feasible ξ'],[['−0.5',t?'1.5':'?'],['0.4',t?'0.6':'?'],['1.2',t?'0':'?']]);right=formula('yᵢ f(xᵢ) ≥ 1 − ξᵢ,　ξᵢ ≥ 0')+(t===0?pause('What is the smallest slack allowed in each row?'):formula('ξᵢ = max(0, 1 − yᵢ f(xᵢ))'))+(t>=2?'<p>When C &gt; 0, minimising over slack variables gives exactly the hinge-loss objective.</p><p class="muted">Hinge loss measures a signed-score shortfall. Geometric distances also depend on ‖w‖.</p>':'');}
if(i===9){left='<div>'+table(['x','y','α'],[[-2,-1,t>=3?'0':'?'],[-1,-1,t>=3?'½':'?'],[1,1,t>=3?'½':'?'],[2,1,t>=3?'0':'?']])+'</div>';right='<p class="small">Optional dual view · Restore the original labels.</p>'+(t===0?pause('Could the same weight be written using just the two nearest observations?'):formula('w = Σᵢ αᵢ yᵢ xᵢ,　Σᵢ αᵢ yᵢ = 0'))+(t>=2?formula('α₋ = α₊ = a ⇒ w = 2a<br>Dual objective: 2a − 2a²<br>Maximum at a = ½ ⇒ w = 1'):'')+(t>=3?'<p class="correction">Hard margin: αᵢ ≥ 0. Soft margin adds αᵢ ≤ C. The source combines a hard-margin Lagrangian with the soft-margin upper bound.</p>':'');}
if(i===10){right=t===0?pause('Can one threshold on raw x classify both outer points as positive and the middle point as negative?'):t===1?'<p>Lift x to a coordinate x². Now a threshold at x² = 1 separates them.</p>':formula('K(x,z) = (1 + xz)²<br>φ(x) = [1, √2 x, x²]<br>φ(x)·φ(z) = 1 + 2xz + x²z²')+(t>=3?'<p>The dual uses pairwise inner products. A kernel computes those inner products without explicitly constructing every feature.</p><p class="muted">The drawn separator is a teaching example, not a claimed fitted optimum.</p>':'');after=()=>kernelPlot('plot',t>0);}
if(i===11){right=t===0?pause('For two fixed inputs one unit apart, will increasing σ increase or decrease their RBF similarity?'):formula('K(x,z) = exp(−‖x − z‖² / (2σ²))')+(t>=2?controls('σ','sigma',st.sigma,.25,2.5,.05)+'<div id="live" aria-live="polite"></div><p class="muted">This changes a similarity calculation. A fitted SVM also needs learned dual weights and a bias.</p>':'');after=()=>{rbfPlot('plot',st.sigma);if($('sigma')){function update(){rbfPlot('plot',st.sigma);$('sigma-value').textContent=fmt(st.sigma,2);$('live').innerHTML='<p class="answer">At distance 1: K = '+fmt(rbf(1,st.sigma))+'</p>';}$('sigma').oninput=e=>{st.sigma=+e.target.value;update();};update();}};}
if(i===12){left=table(['Quantity','Role'],[['y f(x)','Signed score'],['max(0, 1 − y f(x))','Margin violation cost'],['C','Weight on violations'],['K(x,z)','Feature-space inner product']]);right=t===0?pause('Explain why a correctly classified point can matter to an SVM. Then explain what a kernel changes.'):t===1?'<p>The objective balances weight size and unit-margin violations. Nonzero dual weights determine which training observations contribute to the score.</p>':'<p>The sign of the score gives a class decision. Its magnitude is not automatically a calibrated probability.</p><p class="muted">Use validation to select C and kernel settings. Larger C is not a guarantee of better predictions on new data.</p>';}
return{left,right,after};}
window.lessonModel={svmData,hinge,objective,rbf};

let index=0,states=slides.map((_,i)=>initial(i));
const s=()=>states[index];
const maximum=()=>typeof slideSteps==='function'?slideSteps(index,s()):slides[index].steps;
function render(){
 const focus=document.activeElement&&document.activeElement.id;
 $('slide-title').textContent=slides[index].title;$('source').textContent=slides[index].source||'';
 const part=content(index,s().step,s());
 $('stage').innerHTML=part.html!==undefined?part.html:(part.left||'')+'<section class="copy">'+(part.right||'')+'</section>';
 if(part.after)part.after();
 $('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+maximum();$('jump').value=index;
 $('back').disabled=index===0&&s().step===0;$('advance').textContent=s().step<maximum()?'Reveal next':index<slides.length-1?'Next slide':'Start again';
 $('progress').style.width=100*(index+s().step/Math.max(1,maximum()))/slides.length+'%';
 $('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+maximum();
 if(focus&&$(focus)&&!['jump','advance','back','reset'].includes(focus))$(focus).focus({preventScroll:true});
}
const refresh=()=>render();
function advance(){if(s().step<maximum())s().step++;else if(index<slides.length-1){index++;states[index]=initial(index);}else{index=0;states=slides.map((_,i)=>initial(i));}render();}
function back(){if(s().step>0)s().step--;else if(index>0){index--;s().step=maximum();}render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('announcement').textContent='Open this file in a desktop browser to use full screen.';}}
$('jump').innerHTML=slides.map((v,i)=>'<option value="'+i+'">'+(i+1)+'. '+v.title+'</option>').join('');
$('jump').onchange=e=>{index=+e.target.value;states[index]=initial(index);render();};$('advance').onclick=advance;$('back').onclick=back;$('reset').onclick=()=>{states[index]=initial(index);render();};$('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||(e.key===' '&&['BUTTON','A'].includes(e.target.tagName)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();advance();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}else if(e.key==='Home'){e.preventDefault();index=0;states=slides.map((_,i)=>initial(i));render();}else if(e.key.toLowerCase()==='r'){states[index]=initial(index);render();}else if(e.key.toLowerCase()==='f')fullscreen();});
window.lesson={slides,getState:()=>({index,...s()}),maximum,advance,back,render,goTo:i=>{index=i;states[i]=initial(i);render();}};
render();
</script></body></html>
