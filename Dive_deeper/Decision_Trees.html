const rows=[{"id": "D1", "outlook": "Sunny", "humidity": "High", "wind": "Weak", "play": "No"}, {"id": "D2", "outlook": "Sunny", "humidity": "High", "wind": "Strong", "play": "No"}, {"id": "D3", "outlook": "Overcast", "humidity": "High", "wind": "Weak", "play": "Yes"}, {"id": "D4", "outlook": "Rain", "humidity": "High", "wind": "Weak", "play": "Yes"}, {"id": "D5", "outlook": "Rain", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D6", "outlook": "Rain", "humidity": "High", "wind": "Strong", "play": "No"}, {"id": "D7", "outlook": "Overcast", "humidity": "Normal", "wind": "Strong", "play": "Yes"}, {"id": "D8", "outlook": "Sunny", "humidity": "High", "wind": "Weak", "play": "No"}, {"id": "D9", "outlook": "Sunny", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D10", "outlook": "Rain", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D11", "outlook": "Sunny", "humidity": "Normal", "wind": "Strong", "play": "Yes"}, {"id": "D12", "outlook": "Overcast", "humidity": "High", "wind": "Strong", "play": "Yes"}, {"id": "D13", "outlook": "Overcast", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D14", "outlook": "Rain", "humidity": "High", "wind": "Strong", "play": "No"}], literalRows=[{"id": "D1", "outlook": "Sunny", "humidity": "High", "wind": "Weak", "play": "No"}, {"id": "D2", "outlook": "Sunny", "humidity": "High", "wind": "Strong", "play": "No"}, {"id": "D3", "outlook": "Overcast", "humidity": "High", "wind": "Weak", "play": "Yes"}, {"id": "D4", "outlook": "Rain", "humidity": "High", "wind": "Weak", "play": "Yes"}, {"id": "D5", "outlook": "Rain", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D6", "outlook": "Sunny", "humidity": "High", "wind": "Weak", "play": "No"}, {"id": "D7", "outlook": "Overcast", "humidity": "Normal", "wind": "Strong", "play": "Yes"}, {"id": "D8", "outlook": "Sunny", "humidity": "High", "wind": "Weak", "play": "No"}, {"id": "D9", "outlook": "Sunny", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D10", "outlook": "Rain", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D11", "outlook": "Sunny", "humidity": "Normal", "wind": "Strong", "play": "Yes"}, {"id": "D12", "outlook": "Overcast", "humidity": "High", "wind": "Strong", "play": "Yes"}, {"id": "D13", "outlook": "Overcast", "humidity": "Normal", "wind": "Weak", "play": "Yes"}, {"id": "D14", "outlook": "Rain", "humidity": "High", "wind": "Strong", "play": "No"}];
const YES='#16704e',NO='#bc3c4b',INK='#183349',BLUE='#2463b7';
const features=['outlook','humidity','wind'],names={outlook:'Outlook',humidity:'Humidity',wind:'Wind'},values={outlook:['Sunny','Overcast','Rain'],humidity:['High','Normal'],wind:['Weak','Strong']};
function counts(data){const yes=data.filter(r=>r.play==='Yes').length;return {yes,no:data.length-yes,n:data.length};}
function entropy(y,n){const total=y+n;if(!total)return 0;return [y,n].filter(v=>v>0).reduce((h,v)=>h-v/total*Math.log2(v/total),0);}
function split(data,feature){const c=counts(data),parent=entropy(c.yes,c.no),children=values[feature].map(value=>{const sub=data.filter(r=>r[feature]===value),v=counts(sub);return {value,rows:sub,...v,h:entropy(v.yes,v.no),weight:sub.length/data.length};}).filter(g=>g.n);const weighted=children.reduce((v,g)=>v+g.weight*g.h,0);return {feature,parent,children,weighted,gain:parent-weighted};}
function buildTree(data,available=features,forced=null,path='root'){
 const c=counts(data),node={...c,rows:data,path,prediction:c.yes>c.no?'Yes':'No'};
 if(!c.yes||!c.no||!available.length)return node;
 const candidates=available.map(f=>split(data,f)).sort((a,b)=>b.gain-a.gain||features.indexOf(a.feature)-features.indexOf(b.feature)),best=forced?split(data,forced):candidates[0];
 if(best.gain<1e-12)return node;
 node.feature=best.feature;node.gain=best.gain;node.children=best.children.map(g=>({value:g.value,node:buildTree(g.rows,available.filter(f=>f!==best.feature),null,path+'/'+g.value)}));return node;
}
const greedyTree=buildTree(rows),outlookTree=buildTree(rows,features,'outlook');
function route(tree,query){const path=[tree];let n=tree;while(n.children){const next=n.children.find(c=>c.value===query[n.feature]);if(!next)break;n=next.node;path.push(n);}return {path,prediction:n.prediction,ids:n.rows.map(r=>r.id)};}
function depth(n){return n.children?1+Math.max(...n.children.map(c=>depth(c.node))):0;}
function leaves(n){return n.children?n.children.reduce((s,c)=>s+leaves(c.node),0):1;}
const numeric=[{x:1,play:'No'},{x:2,play:'No'},{x:3,play:'Yes'},{x:4,play:'Yes'},{x:5,play:'No'},{x:6,play:'No'}];
const regression=[{x:1,y:1},{x:2,y:2},{x:3,y:2},{x:4,y:8},{x:5,y:8},{x:6,y:9}];
function numericSplit(t){const children=[numeric.filter(p=>p.x<=t),numeric.filter(p=>p.x>t)].map(data=>{const c=counts(data);return {...c,h:entropy(c.yes,c.no)};});const parent=entropy(2,4),weighted=children.reduce((s,c)=>s+c.n/6*c.h,0);return {children,parent,weighted,gain:parent-weighted};}
function regressionSplit(t){const children=[regression.filter(p=>p.x<=t),regression.filter(p=>p.x>t)].map(data=>{const mean=data.reduce((s,p)=>s+p.y,0)/data.length,sse=data.reduce((s,p)=>s+(p.y-mean)**2,0);return {n:data.length,mean,sse};});return {children,sse:children.reduce((s,c)=>s+c.sse,0)};}

 {title:'One data inconsistency',steps:1,source:'Trees notes, pp1–3 · Reconstruction, not a claim about the original observation'},

 {title:'Entropy at the root',steps:3,source:'Trees notes, pp1 and 5'},
 {title:'A candidate split: Wind',steps:3,source:'Trees notes, pp3 and 5 · Reconstructed D6'},
 {title:'From children to information gain',steps:3,source:'Trees notes, pp4–5 · Strong-child term corrected'},
 {title:'Outlook as a candidate root',steps:3,source:'Trees notes, pp2–3 · Gain calculated from the retained data'},
 {title:'The remaining candidate: Humidity',steps:3,source:'Trees notes, p1 data · Added comparison under the notes’ entropy criterion'},
 {title:'Choose the first split',steps:2,source:'Trees notes, pp3–5 · All three features compared'},
 {title:'Does the D6 choice change the root?',steps:1,source:'Trees notes, pp1–2 · Literal table versus stated reconstruction'},
 {title:'Split the remaining subset',steps:3,source:'Trees notes, pp3–4 · Recursive split calculation on High humidity'},
 {title:'Grow the tree',steps:3,source:'Trees notes, pp2–4 · Greedy entropy tree for the reconstructed data'},
 {title:'Route a new observation',steps:4,source:'Trees notes, p1 · D15 = Rain, High, Weak'},
 {title:'Two complete trees',steps:2,source:'Trees notes, p2 tree versus the computed greedy tree'},
 {title:'When should growth stop?',steps:2,source:'Trees notes, pp3 and 5 · Stopping conditions clarified'},
 {title:'Numeric features: choose a threshold',steps:2,source:'Extension · Trees notes, p5 · Six-point illustration added'},
 {title:'Regression: choose a leaf value',steps:3,source:'Extension · Trees notes, p6 · Six-point illustration added'},
 {title:'Explain the decision',steps:2,source:'Trees notes, pp1–6 · Connect to the Day 5 lecture'}
];
const $=id=>document.getElementById(id),fmt=v=>v.toFixed(4),initial=i=>({step:0,p:.5,variant:'repaired',feature:'humidity',query:{outlook:'Rain',humidity:'High',wind:'Weak'},threshold:i===16?3.5:2.5});
let index=0,states=slides.map((_,i)=>initial(i));const s=()=>states[index];
function maximum(){return index===12?route(greedyTree,s().query).path.length:slides[index].steps;}
function countText(c){return '<span class="yes">'+c.yes+' Yes</span> / <span class="no">'+c.no+' No</span>';}
function pause(text){return '<p class="pause">'+text+'</p>';}

function dataTable(data,compact=false){return '<table class="data"><thead><tr><th>Day</th><th>Outlook</th><th>Humidity</th><th>Wind</th><th>Play</th></tr></thead><tbody>'+data.map(r=>'<tr class="'+(r.id==='D6'?'amended':'')+'"><td>'+r.id+(r.id==='D6'?'*':'')+'</td><td>'+r.outlook+'</td><td>'+r.humidity+'</td><td>'+r.wind+'</td><td class="target '+r.play.toLowerCase()+'">'+r.play+'</td></tr>').join('')+'</tbody></table>'+(compact?'':'<p class="data-caption">* D6 follows the routing on p2: Rain, High, Strong, No.<br>D14 retains High humidity. All 14 observations have equal weight.</p>');}
function gainTable(data,revealed=true){return '<table class="comparison-table"><thead><tr><th>Feature</th><th>After split<br><small>bits</small></th><th>Gain<br><small>bits</small></th></tr></thead><tbody>'+features.map(f=>{const a=split(data,f);return '<tr'+(revealed&&f==='humidity'?' class="winner"':'')+'><td>'+names[f]+'</td><td>'+(revealed?fmt(a.weighted):'…')+'</td><td>'+(revealed?fmt(a.gain):'…')+'</td></tr>';}).join('')+'</tbody></table>';}
function queryControls(){return '<div class="controls query-controls">'+features.map(f=>'<label><span>'+names[f]+'</span><select id="query-'+f+'">'+values[f].map(v=>'<option '+(s().query[f]===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</div>';}
function thresholdControl(){return '<div class="controls"><label><span>Threshold t</span><input id="threshold" type="range" min="1.5" max="5.5" step="1" value="'+s().threshold+'"><output id="threshold-value">'+s().threshold+'</output></label></div>';}
function render(){
 const t=s().step,st=s();let left=visual(),right='',draw=null;
 $('slide-title').textContent=slides[index].title;$('source').textContent=slides[index].source;
 if(index===0){left='<div>'+dataTable(rows)+'</div>';right='<p class="lead">Will Parastoo play tennis?</p><p><strong>D15: Rain · High humidity · Weak wind</strong></p>'+pause('Which question would you ask first? Give a reason from the labelled days.')+(t?'<p>A tree asks a sequence of questions. We will choose each question by comparing the resulting subsets.</p>':'<p class="muted">25–30 minutes, plus two optional extensions.<br>Predict before each reveal.</p>');}
 if(index===1){left='<table class="comparison-table"><thead><tr><th>D6</th><th>Page 1 table</th><th>Used here</th></tr></thead><tbody><tr><td>Outlook</td><td>Sunny</td><td>Rain</td></tr><tr><td>Humidity</td><td>High</td><td>High</td></tr><tr><td>Wind</td><td>Weak</td><td>Strong</td></tr><tr><td>Play</td><td>No</td><td>No</td></tr></tbody></table>';right='<p>Page 2 routes D6 into <strong>Rain → Strong</strong>. Later counts follow that routing.</p>'+(t?'<p>We use that reconstruction for the worked calculations.</p><p class="correction">It reconciles the written example; it does not establish the original observation. We will also compare the literal table.</p><p class="muted">“Rain” and “Rainy” are treated as the same category. No other values are changed.</p>':pause('Which counts can change when this one row moves? Which total stays fixed?'));}
 if(index===2){right=t===0?'<p class="lead">Compare three nodes.</p><p>6 Yes / 0 No<br>3 Yes / 3 No<br>0 Yes / 6 No</p>'+pause('Which two are equally pure? Which is most mixed?'):'<div class="formula">H(p) = −p log₂ p − (1 − p) log₂(1 − p)</div>'+(t>=2?'<div class="controls"><label><span>p(Yes)</span><input id="purity" type="range" min="0" max="1" step="0.05" value="'+st.p+'"><output id="purity-value">'+st.p.toFixed(2)+'</output></label></div><div id="live" aria-live="polite"></div><p class="muted">Use the continuous convention 0 log₂ 0 = 0. Pure nodes have zero entropy.</p>':pause('Would changing every Yes to No change the entropy?'));draw=()=>drawEntropy($('diagram'),t>0,st.p);}
 if(index===3){right='<div class="counts">'+countText(counts(rows))+'</div>'+(t===0?pause('Should the entropy be below, equal to, or above 1 bit?'):'<div class="formula">H(S) = −(9/14) log₂(9/14)<br>　　　 − (5/14) log₂(5/14)</div>')+(t>=2?'<div class="formula">≈ 0.4098 + 0.5305</div>':'')+(t>=3?'<p class="answer">H(S) ≈ 0.9403 bits</p><p class="muted">Keep full precision internally; round displayed results at the end.</p>':'');draw=()=>drawClassDots($('diagram'),9,5,t>=3?'H = 0.9403 bits':'14 labelled observations');}
 if(index===4){right=t===0?'<p>Split the 14 days into <strong>Weak</strong> and <strong>Strong</strong> wind.</p>'+pause('Count Yes and No in each child. Which child is more mixed?'):'<p>Weak: '+countText({yes:6,no:2})+'<br>Strong: '+countText({yes:3,no:3})+'</p>'+(t>=2?'<div class="formula">H(Weak) = −¾ log₂ ¾ − ¼ log₂ ¼<br>≈ <strong>0.8113</strong></div>':'')+(t>=3?'<div class="formula">H(Strong) = H(½, ½) = <strong>1</strong></div>':pause('Calculate the entropy of each child.'));draw=()=>drawStump($('diagram'),split(rows,'wind'),t>=1,t>=2,t>=3);}
 if(index===5){const a=split(rows,'wind');right=t===0?pause('How should the two child entropies be combined? Explain why the weights differ.'):'<div class="formula">H(after) = (8/14) H(Weak)<br>　　　　　 + (6/14) H(Strong)</div>'+(t>=2?'<div class="formula">≈ (8/14)(0.8113) + (6/14)(1)<br>≈ <strong>0.8922 bits</strong></div>':'')+(t>=3?'<div class="formula">Gain = H(parent) − H(after)<br>≈ 0.9403 − 0.8922 = <strong>0.0481</strong></div><p class="correction">On p5, the second term repeats H(Weak). It must use H(Strong). The full-precision gain rounds to 0.048, not 0.049.</p>':'');draw=()=>drawStump($('diagram'),a,true,true,true);}
 if(index===6||index===7){const f=index===6?'outlook':'humidity',a=split(rows,f),formula=f==='outlook'?'(5/14)(0.9710) + (4/14)(0)<br>+ (5/14)(0.9710)':'(8/14)(0.9544) + (6/14)(0)';right='<p class="lead">'+(f==='outlook'?'A pure child looks promising.':'One branch contains only Yes labels.')+'</p>'+(t===0?pause('Will this split improve on the candidates seen so far? Commit to a prediction.'):a.children.map(c=>'<p class="small">H('+c.value+') = H('+c.yes+', '+c.no+') = <strong>'+fmt(c.h)+'</strong></p>').join(''))+(t>=2?'<div class="formula">H(after) ≈ '+formula+'<br>= <strong>'+fmt(a.weighted)+'</strong></div>':'')+(t>=3?'<p class="answer">Gain = H(parent) − H(after)<br>≈ '+fmt(a.gain)+' bits</p>':'');draw=()=>drawStump($('diagram'),a,true,t>0,t>0);}
 if(index===8){left='<div>'+gainTable(rows,t>=1)+'</div>';right=t===0?pause('Which feature maximises the decrease in entropy? State the rule, then choose.'):'<p class="answer">Choose Humidity.</p><p>Its weighted child entropy is lowest, so its gain is largest.</p>'+(t>=2?'<p class="correction">The Outlook-first tree on p2 is a valid tree. It is not the greedy maximum-gain root among these three features.</p><p class="muted">This comparison uses one branch per category: an ID3-style split rule.</p>':'');}
 if(index===9){left='<div id="gain-table">'+gainTable(st.variant==='literal'?literalRows:rows,t>=1)+'</div>';right=t===0?'<p>Restore D6 exactly as recorded on p1: <strong>Sunny, High, Weak, No</strong>.</p>'+pause('Could that change which feature has the highest gain?'):'<div class="controls"><label for="variant">D6 interpretation</label><select id="variant"><option value="repaired" '+(st.variant==='repaired'?'selected':'')+'>Reconstruction: Rain / Strong</option><option value="literal" '+(st.variant==='literal'?'selected':'')+'>Literal p1: Sunny / Weak</option></select></div><div id="live" aria-live="polite"></div><p class="muted">This audit changes D6’s Outlook and Wind together. Humidity and the target are unchanged.</p>';}
 if(index===10){const high=rows.filter(r=>r.humidity==='High');left='<div>'+dataTable(high,true)+'<p class="data-caption">Only the 8 High-humidity observations enter this decision.</p></div>';right='<p>Normal humidity is pure: <span class="yes">6 Yes, 0 No</span>. Stop there.</p><p>High humidity: '+countText(counts(high))+'.</p>'+(t===0?pause('Inside High, compare Outlook with Wind. Do the child-size weights still use 14?'):t===1?'<div class="formula">H(High) = 0.9544</div><p>Outlook: Sunny (0,3), Overcast (2,0), Rain (1,2).</p>'+pause('Weight these children by 3/8, 2/8 and 3/8.'):'<div class="formula">H(after Outlook) = (3/8)(0)<br>+ (2/8)(0) + (3/8)(0.9183)<br>≈ 0.3444</div><p class="answer">Gain ≈ 0.6101 bits</p>')+(t>=3?'<p class="small">Wind gain ≈ 0.0488. Choose <strong>Outlook</strong> within High.</p>':'');}
 if(index===11){right=t===0?pause('Apply the same rule recursively. Which branches can already stop?'):t===1?'<p>Normal is pure. High needs another split.</p>':t===2?'<p>Within High, Sunny and Overcast are pure.</p>'+pause('How can Wind separate the remaining Rain observations?'):'<p>High + Rain contains D4 (Yes), D6 (No), D14 (No).</p><p>Weak isolates D4. Strong groups D6 and D14.</p><p class="answer">All five leaves are pure.</p><p class="muted">Purity describes these training observations.</p>';draw=()=>drawTree($('diagram'),greedyTree,{maxDepth:t});}
 if(index===12){const r=route(greedyTree,st.query),shown=r.path.slice(0,t),done=t>=r.path.length;right=queryControls()+(t===0?pause('Predict the leaf before revealing the route. Changing any input resets the reveal.'):t<r.path.length?'<p>Follow the highlighted test and branch.</p>':'')+'<div id="route-result" aria-live="polite">'+(done?'<p class="live-result '+r.prediction.toLowerCase()+'">Prediction: '+r.prediction+'</p><p class="small">Leaf observations: '+r.ids.join(', ')+'</p>':'')+'</div>';draw=()=>drawTree($('diagram'),greedyTree,{highlight:shown.map(n=>n.path)});}
 if(index===13){left='<div class="two-trees"><section><h2>Greedy entropy root</h2>'+visual('greedy')+'<p>'+(t?'Depth 3 · 5 leaves · 0 training errors':'Root: Humidity')+'</p></section><section><h2>Source’s chosen root</h2>'+visual('forced')+'<p>'+(t?'Depth 2 · 5 leaves · 0 training errors':'Root: Outlook (forced)')+'</p></section></div><p class="full-caption">'+(t>=2?'The best immediate entropy reduction does not guarantee the shallowest complete tree. Neither training fit establishes which tree generalises better.':t===1?'Both fit all 14 observations. Which objective did the root comparison actually optimise?':'Predict which tree is shallower and whether either makes a training error.')+'</p>';right=null;draw=()=>{drawTree($('greedy'),greedyTree,{small:true});drawTree($('forced'),outlookTree,{small:true});};}
 if(index===14){right='<p>Four observations have exactly the same input values, with <strong>3 Yes and 1 No</strong>.</p>'+(t===0?pause('Can any split on those inputs make both children pure?'):t===1?'<p>No input test can separate identical feature vectors. A mixed node may have to become a leaf.</p><p>Under ordinary classification error, predict its majority class: <span class="yes">Yes</span>.</p>':'<p>Also stop when a depth or leaf-size limit is reached.</p><p>Use validation to choose complexity or pruning. Pure training leaves alone do not establish good generalisation.</p>')+'<p class="muted">Added counterexample; all inputs are identical.</p>';draw=()=>drawClassDots($('diagram'),3,1,t?'No valid split on the inputs':'One inseparable node');}
 if(index===15){const a=numericSplit(st.threshold);right='<p>Use a binary test: <strong>x ≤ t</strong>.</p>'+(t===0?pause('Try the gaps between distinct x values. Which threshold gives the largest gain?'):thresholdControl()+'<div id="live" aria-live="polite"></div>')+(t>=2?'<p class="small">Best candidates: <strong>t = 2.5 or 4.5</strong>, each with gain 0.2516. State a tie rule when choosing one.</p><p class="muted">CART uses binary splits. The earlier one-branch-per-category example is not a scikit-learn CART fit.</p>':'');draw=()=>drawNumeric($('diagram'),t>0,st.threshold);}
 if(index===16){right='<p>Predict a constant in each leaf, using <strong>squared-error loss</strong>.</p>'+(t===0?pause('At t = 3.5, which two constants minimise the total squared error?'):(t<3?'<div class="formula">At t = 3.5:<br>Left mean = (1 + 2 + 2)/3 = 5/3<br>Right mean = (8 + 8 + 9)/3 = 25/3</div>':'<p class="small">Move the threshold. Predict how the leaf means and squared error will change.</p>'))+(t===2?'<div class="formula">SSE(left) = 2/3<br>SSE(right) = 2/3<br>Total SSE = <strong>4/3</strong></div>':'')+(t>=3?thresholdControl()+'<div id="live" aria-live="polite"></div><p class="muted">Compare total child SSE, equivalently sample-weighted child variance. Do not average child variances without weights.</p>':'');draw=()=>drawRegression($('diagram'),t>0,t<3?3.5:st.threshold);}
 if(index===17){left='<div><h2>One prediction, four ingredients</h2><table class="comparison-table"><tbody><tr><td>Inputs</td><td>D15: Rain, High, Weak</td></tr><tr><td>Split rule</td><td>Maximum weighted entropy reduction</td></tr><tr><td>Stopping</td><td>Pure, inseparable, or constrained</td></tr><tr><td>Leaf output</td><td>Majority class; mean under squared error</td></tr></tbody></table></div>';right=t===0?pause('Explain why D15 reaches Yes. Then name one modelling choice that could change the tree.'):t===1?'<p>A tree partitions the input space recursively, then returns the output stored at the reached leaf.</p><p>A split criterion chooses the next question; it does not optimise every property of the complete tree.</p>':'<p>For more than two classes, use the same principle:</p><div class="formula">H(S) = −Σ<sub>c</sub> p<sub>c</sub> log₂ p<sub>c</sub></div><p>Predict the most frequent class at a classification leaf.</p><p class="muted">The Day 5 lecture also uses Gini impurity. Changing the criterion changes what “best split” means.</p>';}
 $('stage').innerHTML=right===null?left:left+'<section class="copy">'+right+'</section>';
 if(draw)draw();bindControls();updateLive();finish();
}
function updateLive(){
 if(!$('live'))return;let html='';
 if(index===2)html='<p class="answer">H = '+fmt(entropy(s().p,1-s().p))+' bits</p>';
 if(index===9)html='<p class="answer">Humidity still has the largest gain.</p><p>D6: '+(s().variant==='literal'?'Sunny · High · Weak · No':'Rain · High · Strong · No')+'</p>';
 if(index===15){const a=numericSplit(s().threshold);html='<p class="small">Left: '+countText(a.children[0])+'<br>Right: '+countText(a.children[1])+'</p><div class="formula">H(after) = ('+a.children[0].n+'/6)('+fmt(a.children[0].h)+')<br>+ ('+a.children[1].n+'/6)('+fmt(a.children[1].h)+')<br>≈ '+fmt(a.weighted)+'</div><p class="answer">Gain ≈ '+fmt(a.gain)+'</p>';}
 if(index===16){const a=regressionSplit(s().threshold);html='<p class="small">Current leaf means: '+fmt(a.children[0].mean)+' and '+fmt(a.children[1].mean)+'<br>Current total child SSE: <strong>'+fmt(a.sse)+'</strong></p>';}
 $('live').innerHTML=html;
}
function bindControls(){
 if($('purity'))$('purity').oninput=e=>{s().p=+e.target.value;$('purity-value').textContent=s().p.toFixed(2);drawEntropy($('diagram'),true,s().p);updateLive();};
 if($('variant'))$('variant').onchange=e=>{s().variant=e.target.value;$('gain-table').innerHTML=gainTable(s().variant==='literal'?literalRows:rows,true);updateLive();};
 features.forEach(f=>{if($('query-'+f))$('query-'+f).onchange=e=>{s().query[f]=e.target.value;s().step=0;render();};});
 if($('threshold'))$('threshold').oninput=e=>{s().threshold=+e.target.value;$('threshold-value').textContent=s().threshold;if(index===15)drawNumeric($('diagram'),true,s().threshold);else drawRegression($('diagram'),true,s().threshold);updateLive();};
}
function svgStart(svg,title,w=650,h=450){svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('aria-label',title);return '<title>'+title+'</title>';}
function text(x,y,label,cls='',anchor='middle'){return '<text x="'+x+'" y="'+y+'" class="'+cls+'" text-anchor="'+anchor+'">'+label+'</text>';}
function nodeSvg(x,y,title,c,active=false,w=130){const fill=!c.no?'#e8f3ec':!c.yes?'#f9ebed':'#f0f4f7';return '<rect x="'+(x-w/2)+'" y="'+(y-28)+'" width="'+w+'" height="56" rx="5" fill="'+fill+'" stroke="'+(active?YES:'#a5b8c6')+'" stroke-width="'+(active?3:1.3)+'"/>'+text(x,y-5,title,'node-title')+text(x,y+17,c.yes+' Yes / '+c.no+' No','node-count');}
function drawClassDots(svg,yes,no,caption){let html=svgStart(svg,caption);const total=yes+no;for(let i=0;i<total;i++){const x=130+(i%7)*62,y=155+Math.floor(i/7)*85;html+='<circle cx="'+x+'" cy="'+y+'" r="22" fill="'+(i<yes?YES:NO)+'"/>'+text(x,y+6,i<yes?'Y':'N','dot-label');}html+=text(325,365,caption,'annotation');svg.innerHTML=html;svg.querySelectorAll('.dot-label').forEach(e=>e.setAttribute('style','fill:white;font-size:19px;font-weight:bold'));}
function drawEntropy(svg,reveal,p){let html=svgStart(svg,'Binary entropy as the Yes proportion changes');const X=v=>75+v*500,Y=v=>360-v*280;html+='<path d="M75 65V360H585" fill="none" stroke="#8c9eac"/>';[0,.25,.5,.75,1].forEach(v=>{html+=text(X(v),387,String(v),'tick');});[0,.5,1].forEach(v=>{html+=text(58,Y(v)+5,String(v),'tick','end');});html+=text(325,430,'Proportion Yes','axis')+'<text transform="translate(25 220) rotate(-90)" text-anchor="middle" class="axis">Entropy (bits)</text>';if(reveal){let d='';for(let i=0;i<=100;i++)d+=(i?'L':'M')+X(i/100)+' '+Y(entropy(i/100,1-i/100))+' ';html+='<path d="'+d+'" fill="none" stroke="'+BLUE+'" stroke-width="3"/><circle cx="'+X(p)+'" cy="'+Y(entropy(p,1-p))+'" r="7" fill="'+YES+'"/>';}svg.innerHTML=html;}
function drawStump(svg,a,showCounts,firstH,allH){let html=svgStart(svg,names[a.feature]+' split of the training observations'),n=a.children.length;html+=nodeSvg(325,70,names[a.feature],counts(rows));a.children.forEach((c,i)=>{const x=n===2?175+i*300:105+i*220,y=235;html+='<path class="tree-edge" d="M325 98L'+x+' '+(y-28)+'"/>'+text((325+x)/2,(98+y-28)/2-12,c.value,'edge-label');if(showCounts)html+=nodeSvg(x,y,c.value,c);else html+='<rect x="'+(x-65)+'" y="207" width="130" height="56" rx="5" fill="white" stroke="#a5b8c6"/>'+text(x,242,'Yes? / No?','node-title');if(showCounts){const ids=c.rows.map(r=>r.id);for(let j=0;j<ids.length;j+=4)html+=text(x,300+(j/4)*22,ids.slice(j,j+4).join(', '),'ids');}if(firstH&&(i===0||allH))html+=text(x,380,'H = '+fmt(c.h),'annotation');});svg.innerHTML=html;}
function drawTree(svg,tree,options={}){
 const {maxDepth=99,highlight=[],small=false}=options,w=small?650:720,h=450;let html=svgStart(svg,'Decision tree: '+names[tree.feature]+' root',w,h),list=[],edges=[],leafCounter=0;
 function layout(n,d){const item={n,d,x:0,y:45+d*112};list.push(item);if(n.children){const children=n.children.map(c=>({value:c.value,item:layout(c.node,d+1)}));item.x=(children[0].item.x+children[children.length-1].item.x)/2;children.forEach(c=>edges.push({from:item,to:c.item,value:c.value}));}else{item.x=leafCounter++;}return item;}
 layout(tree,0);const pad=67,unit=(w-pad*2)/Math.max(1,leafCounter-1);list.forEach(l=>l.x=pad+l.x*unit);
 edges.filter(e=>e.to.d<=maxDepth).forEach(e=>{const active=highlight.includes(e.to.n.path);html+='<path class="tree-edge '+(active?'active-edge':'')+'" d="M'+e.from.x+' '+(e.from.y+28)+'L'+e.to.x+' '+(e.to.y-28)+'"/>'+text(e.from.x*.25+e.to.x*.75,e.from.y*.30+e.to.y*.70-3,e.value,'edge-label');});
 list.filter(l=>l.d<=maxDepth).forEach(l=>{const title=l.n.children?(l.d<maxDepth?names[l.n.feature]:'Subset'):l.n.prediction;html+=nodeSvg(l.x,l.y,title,l.n,highlight.includes(l.n.path),small?124:118);});svg.innerHTML=html;
}
function drawNumeric(svg,reveal,t){let html=svgStart(svg,'Six labelled numeric observations and a candidate binary threshold');const X=x=>65+x*80;html+='<line x1="100" y1="295" x2="595" y2="295" stroke="#8c9eac"/>';numeric.forEach(p=>{html+='<circle cx="'+X(p.x)+'" cy="220" r="22" fill="'+(p.play==='Yes'?YES:NO)+'"/>'+text(X(p.x),227,p.play==='Yes'?'Y':'N','label-in-dot')+text(X(p.x),325,String(p.x),'tick');});html+=text(335,370,'Numeric feature x','axis');if(reveal)html+='<path d="M'+X(t)+' 110V300" stroke="'+BLUE+'" stroke-width="2.5" stroke-dasharray="6 5"/>'+text(X(t),85,'t = '+t,'annotation')+text(170,410,'Left: x ≤ t','axis')+text(490,410,'Right: x > t','axis');svg.innerHTML=html;svg.querySelectorAll('.label-in-dot').forEach(e=>e.setAttribute('style','fill:white;font-size:19px;font-weight:bold'));}
function drawRegression(svg,reveal,t){let html=svgStart(svg,'Regression observations and constant predictions in two leaves');const X=x=>70+(x-1)*96,Y=y=>370-y*30;html+='<path d="M70 55V370H580" stroke="#8c9eac" fill="none"/>';[0,2,4,6,8,10].forEach(y=>{html+=text(52,Y(y)+5,String(y),'tick','end');});regression.forEach(p=>{html+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="7" fill="'+BLUE+'"/>'+text(X(p.x),395,String(p.x),'tick');});html+=text(320,435,'Numeric feature x','axis')+'<text class="axis" text-anchor="middle" transform="translate(24 210) rotate(-90)">Target y</text>';if(reveal){const a=regressionSplit(t);html+='<path d="M'+X(t)+' 65V370" stroke="#8c9eac" stroke-dasharray="5 4"/><path d="M70 '+Y(a.children[0].mean)+'H'+X(t)+'M'+X(t)+' '+Y(a.children[1].mean)+'H550" stroke="'+YES+'" stroke-width="3" fill="none"/>';regression.forEach(p=>{const mean=a.children[p.x<=t?0:1].mean;html+='<path d="M'+X(p.x)+' '+Y(p.y)+'V'+Y(mean)+'" stroke="'+YES+'" stroke-dasharray="3 3"/>';});}svg.innerHTML=html;}
function finish(){const max=maximum();$('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+max;$('jump').value=index;$('back').disabled=index===0&&s().step===0;$('advance').textContent=s().step<max?'Reveal next':index<slides.length-1?'Next slide':'Start again';$('progress').style.width=100*(index+s().step/max)/slides.length+'%';$('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+max;}
function advance(){if(s().step<maximum()){s().step++;if(index===9&&s().step===1)s().variant='literal';}else if(index<slides.length-1){index++;states[index]=initial(index);}else{index=0;states=slides.map((_,i)=>initial(i));}render();}
function back(){if(s().step>0)s().step--;else if(index>0){index--;s().step=maximum();}render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('announcement').textContent='Open the presentation in a desktop browser to use full screen.';}}
$('jump').innerHTML=slides.map((v,i)=>'<option value="'+i+'">'+(i+1)+'. '+v.title+'</option>').join('');$('jump').onchange=e=>{index=+e.target.value;states[index]=initial(index);render();};$('advance').onclick=advance;$('back').onclick=back;$('reset').onclick=()=>{states[index]=initial(index);render();};$('fullscreen').onclick=fullscreen;
$('data-open').onclick=()=>{const literal=index===9&&s().variant==='literal';$('data-content').innerHTML=dataTable(literal?literalRows:rows,true)+'<p>'+ (literal?'Literal p1 table: D6 = Sunny, High, Weak, No.':'Reconstruction used for this presentation: D6 = Rain, High, Strong, No, following p2 routing. D14 retains High humidity.')+'</p>';$('data-dialog').showModal();};$('data-close').onclick=()=>$('data-dialog').close();
