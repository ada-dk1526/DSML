const colors=['#2463b7','#16704e','#bc3c4b'],labels=['A','B','C'];
const sigmoid=z=>1/(1+Math.exp(-z));
function softmax(z){const m=Math.max(...z),e=z.map(v=>Math.exp(v-m)),sum=e.reduce((a,b)=>a+b,0);return e.map(v=>v/sum);}
const argmax=a=>a.indexOf(Math.max(...a));
function binary(m,q){return m.intercept[0]+m.coef[0][0]*q[0]+m.coef[0][1]*q[1];}
function irisPredict(q,model){
 if(model==='OvR'){const scores=D.ovr.map(m=>binary(m,q));return {prediction:argmax(scores),scores};}
 if(model==='Softmax'){const logits=D.softmax.coef.map((w,i)=>D.softmax.intercept[i]+w[0]*q[0]+w[1]*q[1]),scores=softmax(logits);return {prediction:argmax(scores),scores};}
 const pairs=[[0,1],[0,2],[1,2]],votes=[0,0,0],confidence=[0,0,0];
 D.ovo.forEach((m,k)=>{const [i,j]=pairs[k],d=binary(m,q);votes[d>0?j:i]++;confidence[i]-=d;confidence[j]+=d;});
 const scores=votes.map((v,i)=>v+confidence[i]/(3*(Math.abs(confidence[i])+1)));
 return {prediction:argmax(scores),scores,votes};
}
function toyVotes(acWinner){const votes=[1,1,0];votes[acWinner==='A'?0:2]++;return votes;}
function bars(values,names=labels,max=1){let h='';values.forEach((v,i)=>{const y=90+i*95;h+='<text x="50" y="'+(y+27)+'" class="label">'+names[i]+'</text><rect x="95" y="'+y+'" width="'+(380*v/max)+'" height="46" rx="3" fill="'+colors[i%3]+'"/><text x="'+(110+380*v/max)+'" y="'+(y+29)+'" class="label">'+fmt(v,3)+'</text>';});setSvg('plot',h,'Class values on a common scale');}
function taskDiagram(kind){const tasks=kind==='OvR'?['A versus {B, C}','B versus {A, C}','C versus {A, B}']:['A versus B','A versus C','B versus C'];setSvg('plot',tasks.map((v,i)=>'<rect x="90" y="'+(45+i*115)+'" width="460" height="75" rx="5" fill="#edf2f6" stroke="#9db0c0"/><text x="320" y="'+(90+i*115)+'" text-anchor="middle" class="label">'+v+'</text>').join(''),kind+' binary training tasks');}
function drawIris(model,q,showPrediction=true){const B=D.bounds,W=470,H=320,L=75,T=35,X=x=>L+(x-B.xmin)/(B.xmax-B.xmin)*W,Y=y=>T+H-(y-B.ymin)/(B.ymax-B.ymin)*H;let h='';const g=D.grid,p=g.predictions[model],dx=W/(g.nx-1),dy=H/(g.ny-1);for(let j=0;j<g.ny-1;j++)for(let i=0;i<g.nx-1;i++)h+='<rect x="'+(L+i*dx)+'" y="'+(T+H-(j+1)*dy)+'" width="'+(dx+.3)+'" height="'+(dy+.3)+'" fill="'+colors[p[j*g.nx+i]]+'" fill-opacity=".12"/>';D.points.filter(p=>p.test).forEach(p=>{h+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="4.8" fill="'+colors[p.label]+'" stroke="#183349" stroke-width=".8"/>';});h+='<rect x="'+L+'" y="'+T+'" width="'+W+'" height="'+H+'" fill="none" stroke="#8a9dab"/>';for(let x=-3;x<=4;x++)if(x>=B.xmin&&x<=B.xmax)h+='<text x="'+X(x)+'" y="380" class="tick" text-anchor="middle">'+x+'</text>';[-1,0,1,2].forEach(y=>{if(y>=B.ymin&&y<=B.ymax)h+='<text x="58" y="'+(Y(y)+5)+'" class="tick" text-anchor="end">'+y+'</text>';});h+='<text x="310" y="412" class="axis" text-anchor="middle">PC1</text><text transform="translate(24 195) rotate(-90)" class="axis" text-anchor="middle">PC2</text>';if(q){h+='<path d="M'+(X(q[0])-9)+' '+Y(q[1])+'h18 M'+X(q[0])+' '+(Y(q[1])-9)+'v18" stroke="white" stroke-width="6"/><path d="M'+(X(q[0])-9)+' '+Y(q[1])+'h18 M'+X(q[0])+' '+(Y(q[1])-9)+'v18" stroke="#183349" stroke-width="2.5"/>';if(showPrediction)h+='<text x="315" y="22" text-anchor="middle" class="label">'+model+' predicts '+D.classes[irisPredict(q,model).prediction]+'</text>';}setSvg('plot',h,'Iris classification in the two training-fitted principal-component coordinates');}

function content(i,t,st){let left=visual(),right='',after=()=>{};
 if(i===0){left='<div>'+table(['Class','Example'],[['A','setosa'],['B','versicolor'],['C','virginica']])+'</div>';right='<p class="lead">One observation. Three possible classes.</p>'+pause('How could a binary logistic model make this decision?')+(t?'<p>We can decompose the task, or fit all class probabilities jointly.</p>':'<p class="muted">25–30 minutes · Predict before each reveal.</p>');}
 if(i===1){left='<div>'+table(['Strategy','Training tasks'],[['OvR',t?'K binary tasks':'?'],['OvO',t>=2?'K(K − 1)/2 binary tasks':'?'],['Multinomial',t>=2?'One joint model, K score vectors':'?']])+'</div>';right=pause('For three classes, how many binary models does each decomposition require?')+(t>=1?'<p>OvR: 3 classes, 3 binary tasks.</p>':'')+(t>=2?'<p>OvO: 3 distinct pairs, also 3 tasks.</p><p class="small">For K = 5, the counts are 5 and 10. Counts alone do not determine runtime.</p>':'');}

 if(i===3){const z=D.added_logits,p=z.map(sigmoid);after=()=>bars(t>=1?p:[0,0,0]);right=formula('z = (ln 4, ln 2, 0)')+(t===0?pause('Predict the largest sigmoid score. Must all three scores sum to one?'):formula('s<sub>i</sub> = σ(z<sub>i</sub>)<br>s = (0.800, 0.667, 0.500)'))+(t>=2?'<p class="metric">Sum = 1.967</p>':'')+(t>=3?'<p>Choose A by the largest score. These independent binary scores are not a jointly normalized distribution.</p><p class="muted">A library may normalize OvR scores afterward; that is not joint softmax fitting.</p>':'');}
 if(i===4){after=()=>taskDiagram('OvO');right=t===0?pause('Which training rows belong in the A-versus-B model?'): '<p>Use A and B rows only. C does not enter that pair’s binary fit.</p>'+formula('P(A | x, y ∈ {A, B})')+(t>=2?'<p>Pair-specific coefficients describe one comparison. Its score is not an unconditional three-class probability.</p>':'');}
 if(i===5){left='<div>'+table(['Pair','Chosen class'],[['A versus B',t>=1?'A':'?'],['B versus C',t>=2?'B':'?'],['A versus C',t>=3?st.ac:'?']])+'</div>';right=t===0?pause('Could three individually decisive pairwise predictions fail to produce one winning class?'):t===1?pause('A has one vote. If B beats C, what would the counts be before the last pair?'):t===2?pause('Predict the final vote count if the remaining pair chooses C.'):'<div class="controls"><label>Winner of A versus C <select id="ac"><option'+(st.ac==='C'?' selected':'')+'>C</option><option'+(st.ac==='A'?' selected':'')+'>A</option></select></label></div><div id="vote-live"></div><p class="muted">The toy rule reports tied votes. Software needs a declared tie rule; our Iris OvO fit uses confidence to resolve vote ties.</p>';if(t>=3)after=()=>{function update(){const v=toyVotes(st.ac);$('vote-live').innerHTML='<p>A: '+v[0]+' · B: '+v[1]+' · C: '+v[2]+'</p><p class="metric">'+(st.ac==='C'?'One vote each: tie':'A has the most votes')+'</p>';}update();$('ac').onchange=e=>{st.ac=e.target.value;refresh();};};}
 if(i===6){after=()=>bars([Math.log(4),Math.log(2),0],labels,1.6);right='<p>Multinomial logistic regression learns one score per class.</p>'+formula('z<sub>i</sub> = w<sub>i</sub>ᵀx + b<sub>i</sub>')+(t===0?pause('How can we turn arbitrary real scores into positive values that sum to one?'):formula('exp(z) = (4, 2, 1)'))+(t>=2?'<p>All scores compete through one common denominator.</p>':'');}
 if(i===7){after=()=>bars(t>=2?softmax(D.added_logits):[4,2,1],labels,t>=2?1:4);right=t===0?pause('Calculate the probability of A using the three exponentials 4, 2 and 1.'):formula('p<sub>i</sub> = exp(z<sub>i</sub>) / Σ<sub>j</sub> exp(z<sub>j</sub>)')+(t>=2?formula('p = (4/7, 2/7, 1/7)'):'')+(t>=3?'<p class="metric">Predict A.</p><p>The probabilities sum to one. Identical fixed logits give the same argmax as their sigmoids, but differently trained models need not agree.</p>':'');}
 if(i===8){after=()=>{function update(){const p=softmax([Math.log(4),st.logitB,0]);bars(p);if($('soft-live'))$('soft-live').innerHTML='<p>p = ('+p.map(v=>fmt(v)).join(', ')+')</p><p class="metric">Largest probability: '+labels[argmax(p)]+'</p>';}update();if($('logit'))$('logit').oninput=e=>{st.logitB=+e.target.value;$('logit-value').textContent=fmt(st.logitB,2);update();};};right=t===0?pause('Increase only B’s logit from ln 2 to ln 8. What happens to A and C, whose logits do not change?'):'<div class="controls"><label>B logit <input id="logit" type="range" min="-1" max="3" step="0.05" value="'+st.logitB+'"><output id="logit-value">'+fmt(st.logitB,2)+'</output></label></div><div id="soft-live"></div>'+(t>=2?'<p>Changing one logit changes the shared denominator. At ln 8, probabilities are (4/13, 8/13, 1/13).</p>':'');}
 if(i===9){left='<div>'+table(['Logits','Softmax probabilities'],[['(ln 4, ln 2, 0)',softmax(D.added_logits).map(v=>fmt(v)).join(', ')],['Add 1000 to every logit',t>=1?softmax(D.added_logits.map(v=>v+1000)).map(v=>fmt(v)).join(', '):'?']])+'</div>';right=t===0?pause('Does a common shift change relative evidence for any class?'):formula('exp(z<sub>i</sub> + c) / Σ exp(z<sub>j</sub> + c)<br>= exp(z<sub>i</sub>) / Σ exp(z<sub>j</sub>)')+(t>=2?'<p>Only score differences matter. Subtract the largest logit before exponentiating to avoid overflow.</p>':'');}
 if(i===10){left='<div>'+table(['True class','Loss −log p(true)'],[['A',t>=1?fmt(-Math.log(4/7)):'?'],['C',t>=2?fmt(-Math.log(1/7)):'?']])+'</div>';right='<p>Keep p = (4/7, 2/7, 1/7).</p>'+pause('Which observed class would give the larger loss?')+(t>=1?formula('L = −Σ<sub>i</sub> y<sub>i</sub> log p<sub>i</sub>'):'')+(t>=2?'<p>Joint fitting rewards assigning probability to the observed class. OvR instead fits separate binary losses.</p><p class="muted">Natural logarithms here; regularization can be added to either objective.</p>':'');}

let index=0,states=slides.map((_,i)=>initial(i));

function render(){
 const focus=document.activeElement&&document.activeElement.id;

 const part=content(index,s().step,s());

 if(part.after)part.after();
 $('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+maximum();$('jump').value=index;

 $('progress').style.width=100*(index+s().step/Math.max(1,maximum()))/slides.length+'%';
 $('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+maximum();

}
const refresh=()=>render();
function advance(){if(s().step<maximum())s().step++;else if(index<slides.length-1){index++;states[index]=initial(index);}else{index=0;states=slides.map((_,i)=>initial(i));}render();}
function back(){if(s().step>0)s().step--;else if(index>0){index--;s().step=maximum();}render();}
