'use strict';
const $=id=>document.getElementById(id);
const fmt=(v,n=3)=>Number(v).toFixed(n);
const pause=t=>'<p class="pause">'+t+'</p>';
const formula=t=>'<div class="formula">'+t+'</div>';
const visual=(id='plot',label='Model illustration')=>'<div class="visual"><svg id="'+id+'" class="chart" role="img" aria-label="'+label+'" viewBox="0 0 640 420"></svg></div>';
const table=(headers,rows,cls='data')=>'<table class="'+cls+'"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
function setSvg(id,markup,label='Model illustration',viewBox='0 0 640 420'){const node=$(id);if(!node)return;node.setAttribute('viewBox',viewBox);node.setAttribute('aria-label',label);node.innerHTML='<title>'+label+'</title>'+markup;}
const slides=[{"title": "Logistic regression", "steps": 1, "source": "Logistic regression · New numerical illustration"}, {"title": "A score becomes a probability", "steps": 1, "source": "Logistic model and sigmoid"}, {"title": "The probability of an observed label", "steps": 2, "source": "Bernoulli likelihood"}, {"title": "The dataset likelihood", "steps": 2, "source": "Likelihood of the Entire Dataset"}, {"title": "Products become sums", "steps": 2, "source": "Log-likelihood derivation"}, {"title": "The negative log-likelihood", "steps": 2, "source": "Cost Function (Negative Log-Likelihood)"}, {"title": "The sigmoid derivative", "steps": 2, "source": "Step-by-Step Gradient Derivation"}, {"title": "The chain rule simplifies", "steps": 2, "source": "Gradient derivation"}, {"title": "Each observation contributes a gradient", "steps": 2, "source": "Final gradient formula"}, {"title": "One gradient-descent update", "steps": 2, "source": "Gradient Descent Update Rule"}, {"title": "The learning rate matters", "steps": 1, "source": "Source update rule · Added one-step experiment"}, {"title": "L2 changes the slope gradient", "steps": 2, "source": "L2 Regularization"}, {"title": "L1 has a corner at zero", "steps": 2, "source": "L1 Regularization · Subgradient clarified"}, {"title": "A proximal shrinkage step", "steps": 1, "source": "Source L1/L2 motivation · Added proximal comparison"}, {"title": "Probability and decision threshold", "steps": 2, "source": "Course context: Day 3 decision boundary"}, {"title": "Explain one model update", "steps": 2, "source": "Logistic regression recap"}];
const xs=[0,1,2],ys=[0,1,0],base={b:-Math.log(3),w:Math.log(3)},m=3;
const sigmoid=z=>z>=0?1/(1+Math.exp(-z)):Math.exp(z)/(1+Math.exp(z));
const softplus=z=>Math.max(0,z)+Math.log1p(Math.exp(-Math.abs(z)));
function logisticStats(b,w){const z=xs.map(x=>b+w*x),p=z.map(sigmoid),loss=z.map((v,i)=>softplus(v)-ys[i]*v),errors=p.map((v,i)=>v-ys[i]);return {b,w,z,p,loss,j:loss.reduce((a,v)=>a+v,0)/m,gb:errors.reduce((a,v)=>a+v,0)/m,gw:errors.reduce((a,v,i)=>a+v*xs[i],0)/m};}
function oneStep(eta){const a=logisticStats(base.b,base.w);return logisticStats(base.b-eta*a.gb,base.w-eta*a.gw);}
function shrink(lambda){const v=base.w-1/3;return {v,l1:Math.max(v-lambda/3,0),l2:v/(1+lambda/3)};}
function initial(){return {step:0,z:1.1,label:1,eta:1,lambda:1};}
function curve(id,fn,xlim,ylim,label,marks=[]){const X=x=>70+(x-xlim[0])/(xlim[1]-xlim[0])*490,Y=y=>350-(y-ylim[0])/(ylim[1]-ylim[0])*290;let h='<path d="M70 55V350H580" fill="none" stroke="#8c9eac"/>';for(let j=0;j<=4;j++){const x=xlim[0]+j*(xlim[1]-xlim[0])/4;h+='<text class="tick" x="'+X(x)+'" y="376" text-anchor="middle">'+fmt(x,1)+'</text>';}for(let j=0;j<=2;j++){const y=ylim[0]+j*(ylim[1]-ylim[0])/2;h+='<text class="tick" x="55" y="'+(Y(y)+5)+'" text-anchor="end">'+fmt(y,1)+'</text>';}let d='';for(let j=0;j<=200;j++){const x=xlim[0]+j*(xlim[1]-xlim[0])/200;d+=(j?'L':'M')+X(x)+' '+Y(fn(x));}h+='<path d="'+d+'" fill="none" stroke="#2463b7" stroke-width="3"/>';marks.forEach(p=>{h+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="7" fill="#bc3c4b"/>';});h+='<text class="axis" x="320" y="411" text-anchor="middle">'+label+'</text>';setSvg(id,h,label);}
function probabilityPlot(b,w){const X=x=>70+x*245,Y=p=>350-p*280;let h='<path d="M70 55V350H580" fill="none" stroke="#8c9eac"/>';[0,1,2].forEach(x=>{h+='<text class="tick" x="'+X(x)+'" y="377" text-anchor="middle">'+x+'</text>';});[0,.5,1].forEach(p=>{h+='<text class="tick" x="55" y="'+(Y(p)+5)+'" text-anchor="end">'+p+'</text>';});let d='';for(let j=0;j<=100;j++){const x=j/50;d+=(j?'L':'M')+X(x)+' '+Y(sigmoid(b+w*x));}h+='<path d="'+d+'" stroke="#2463b7" stroke-width="3" fill="none"/>';xs.forEach((x,i)=>{h+='<circle cx="'+X(x)+'" cy="'+Y(ys[i])+'" r="7" fill="#183349"/><circle cx="'+X(x)+'" cy="'+Y(sigmoid(b+w*x))+'" r="6" fill="#bc3c4b"/>';});h+='<text class="axis" x="320" y="411" text-anchor="middle">Feature x · black labels, red probabilities</text>';setSvg('plot',h,'Logistic probabilities and observed binary labels');}
function initialTable(){return table(['x','y','p at the starting model'],xs.map((x,i)=>[x,ys[i],['1/4','1/2','3/4'][i]]));}
function liveZ(){const p=sigmoid(s().z);$('z-value').textContent=fmt(s().z,2);$('z-live').innerHTML='<p class="answer">p = '+fmt(p)+'</p><p class="small">P(y = 0 | x) = '+fmt(1-p)+'</p>';curve('plot',sigmoid,[-6,6],[0,1],'Linear score z',[[s().z,p]]);}
function liveLoss(){const y=s().label,p=.75,l=-y*Math.log(p)-(1-y)*Math.log(1-p);$('loss-live').innerHTML=formula(y?'ℓ = −ln(0.75) = 0.2877':'ℓ = −ln(0.25) = 1.3863');curve('plot',v=>-y*Math.log(v)-(1-y)*Math.log(1-v),[.01,.99],[0,5],'Predicted probability p',[[p,l]]);}
function liveEta(){const a=oneStep(s().eta);$('eta-value').textContent=fmt(s().eta,1);$('eta-live').innerHTML='<p class="small">New b = '+fmt(a.b)+'; new w = '+fmt(a.w)+'</p><p class="answer">Mean log loss = '+fmt(a.j,4)+'</p><p class="muted">Starting loss = '+fmt(logisticStats(base.b,base.w).j,4)+'. Every setting takes one step from the same starting model.</p>';curve('plot',e=>oneStep(e).j,[0,5],[.5,1.1],'Learning rate η',[[s().eta,a.j]]);}
function liveShrink(){const a=shrink(s().lambda);$('lambda-value').textContent=fmt(s().lambda,1);$('shrink-live').innerHTML=table(['Penalty','New w'],[['L1',fmt(a.l1)],['L2',fmt(a.l2)]])+'<p class="muted">One proximal step after a fixed smooth-loss step. These are not fully fitted models.</p>';const X=l=>70+l*140,Y=w=>350-w*350;let h='<path d="M70 55V350H580" fill="none" stroke="#8c9eac"/>';for(let j=0;j<=3;j++)h+='<text class="tick" x="'+X(j)+'" y="376" text-anchor="middle">'+j+'</text>';[0,.4,.8].forEach(v=>h+='<text class="tick" x="55" y="'+(Y(v)+5)+'" text-anchor="end">'+v+'</text>');['l1','l2'].forEach((key,i)=>{let d='';for(let l=0;l<=3.501;l+=.025)d+=(l?'L':'M')+X(l)+' '+Y(shrink(l)[key]);h+='<path d="'+d+'" fill="none" stroke="'+(i?'#2463b7':'#bc3c4b')+'" stroke-width="3"/><circle cx="'+X(s().lambda)+'" cy="'+Y(a[key])+'" r="7" fill="'+(i?'#2463b7':'#bc3c4b')+'"/>';});h+='<text x="390" y="55" class="label" style="fill:#bc3c4b">L1</text><text x="470" y="55" class="label" style="fill:#2463b7">L2</text><text class="axis" x="320" y="411" text-anchor="middle">Penalty parameter λ</text>';setSvg('plot',h,'L1 and L2 proximal shrinkage after the same smooth-loss step');}
function content(i,t,st){let left='',right='',after;
 if(i===0){left=table(['x','y'],xs.map((x,i)=>[x,ys[i]]));right='<p class="lead">What should a binary model learn from these labels?</p>'+pause('Distinguish a probability prediction from a class decision.')+(t?'<p>We will derive the objective and follow one update.</p><p class="muted">New three-observation illustration. No coding required.</p>':'<p class="muted">25–30 minutes · Predict before each reveal.</p>');}
 if(i===1){left=visual();right=t===0?pause('What does increasing the linear score do to the predicted probability?'):formula('z = b + wx<br>p = σ(z) = 1/(1 + e⁻ᶻ)')+'<div class="controls"><label><span>Score z</span><input id="z" type="range" min="-6" max="6" step="0.05" value="'+st.z+'"><output id="z-value"></output></label></div><div id="z-live" aria-live="polite"></div>';after=()=>{curve('plot',sigmoid,[-6,6],[0,1],'Linear score z');if(t){liveZ();$('z').oninput=e=>{s().z=+e.target.value;liveZ();};}};}
 if(i===2){left='<div class="equation">P(y | x) = pʸ(1 − p)¹⁻ʸ</div>'+(t?table(['Observed y','Probability of that observation'],[[1,'p'],[0,'1 − p']]):'');right=t===0?pause('Substitute y = 1 and y = 0. Why does this single expression handle both?'):'<p>For p = 3/4:</p>'+formula('P(y = 1 | x) = 3/4<br>P(y = 0 | x) = 1/4')+(t>=2?'<p>The likelihood uses the probability of the label actually observed.</p>':'');}
 if(i===3){left=initialTable()+'<p class="data-caption">Starting model: b = −ln 3, w = ln 3. Probabilities follow from these coefficients.</p>';right=t===0?pause('Which probability enters the likelihood for each row?'):formula('L = (1 − 1/4) · (1/2) · (1 − 3/4)')+(t>=2?formula('= (3/4)(1/2)(1/4) = 3/32')+'<p class="muted">We assume conditionally independent labels given the inputs and parameters.</p>':'');}
 if(i===4){left='<div class="equation">log L = Σᵢ [yᵢ ln pᵢ<br>　　　 + (1 − yᵢ) ln(1 − pᵢ)]</div>';right=t===0?pause('Why can we maximise the log of the likelihood instead of the product?'):'<p>Log is increasing, so the maximiser stays the same.</p>'+formula('log L = ln(3/4) + ln(1/2) + ln(1/4)')+(t>=2?formula('= ln(3/32) ≈ −2.3671')+'<p class="muted">Natural logarithms throughout this presentation.</p>':'');}

let index=0,states=slides.map((_,i)=>initial(i));
const s=()=>states[index];
const maximum=()=>typeof slideSteps==='function'?slideSteps(index,s()):slides[index].steps;
function render(){
 const focus=document.activeElement&&document.activeElement.id;
 $('slide-title').textContent=slides[index].title;$('source').textContent=slides[index].source||'';
 const part=content(index,s().step,s());
 $('stage').innerHTML=part.html!==undefined?part.html:(part.left||'')+'<section class="copy">'+(part.right||'')+'</section>';
 if(part.after)part.after();
 $('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+maximum();$('jump').value=index;
 $('back').disabled=index===0&&s().step===0;$('advance').textContent=s().step<maximum()?'Reveal next':index<slides.length-1?'Next slide':'Start again';
 $('progress').style.width=100*(index+s().step/Math.max(1,maximum()))/slides.length+'%';
 $('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+maximum();
 if(focus&&$(focus)&&!['jump','advance','back','reset'].includes(focus))$(focus).focus({preventScroll:true});
}
const refresh=()=>render();
function advance(){if(s().step<maximum())s().step++;else if(index<slides.length-1){index++;states[index]=initial(index);}else{index=0;states=slides.map((_,i)=>initial(i));}render();}
function back(){if(s().step>0)s().step--;else if(index>0){index--;s().step=maximum();}render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('announcement').textContent='Open this file in a desktop browser to use full screen.';}}
$('jump').innerHTML=slides.map((v,i)=>'<option value="'+i+'">'+(i+1)+'. '+v.title+'</option>').join('');
$('jump').onchange=e=>{index=+e.target.value;states[index]=initial(index);render();};$('advance').onclick=advance;$('back').onclick=back;$('reset').onclick=()=>{states[index]=initial(index);render();};$('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||(e.key===' '&&['BUTTON','A'].includes(e.target.tagName)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();advance();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}else if(e.key==='Home'){e.preventDefault();index=0;states=slides.map((_,i)=>initial(i));render();}else if(e.key.toLowerCase()==='r'){states[index]=initial(index);render();}else if(e.key.toLowerCase()==='f')fullscreen();});
