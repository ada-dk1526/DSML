'use strict';
const $=id=>document.getElementById(id);
const fmt=(v,n=3)=>Number(v).toFixed(n);
const pause=t=>'<p class="pause">'+t+'</p>';
const formula=t=>'<div class="formula">'+t+'</div>';
const visual=(id='plot',label='Model illustration')=>'<div class="visual"><svg id="'+id+'" class="chart" role="img" aria-label="'+label+'" viewBox="0 0 640 420"></svg></div>';
const table=(headers,rows,cls='data')=>'<table class="'+cls+'"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
function setSvg(id,markup,label='Model illustration',viewBox='0 0 640 420'){const node=$(id);if(!node)return;node.setAttribute('viewBox',viewBox);node.setAttribute('aria-label',label);node.innerHTML='<title>'+label+'</title>'+markup;}
const slides=[{"title": "Regression as a system of equations", "steps": 1, "source": "Linear Regression and the Normal Equation; Ridge dataset"}, {"title": "A rectangular design matrix", "steps": 2, "source": "Linear Regression and the Normal Equation"}, {"title": "Predictions and residuals", "steps": 1, "source": "Source dataset · Added coefficient demonstration"}, {"title": "Why use half-MSE?", "steps": 2, "source": "Why Use 1/(2m) Instead of 1/m?"}, {"title": "The gradient follows the residuals", "steps": 2, "source": "Derivative Simplification · Day 1 gradient descent"}, {"title": "The normal equations", "steps": 2, "source": "Derivation of the Normal Equation"}, {"title": "The feature dot products", "steps": 2, "source": "Ridge worked example, Step 4"}, {"title": "The feature–response products", "steps": 2, "source": "Ridge worked example, Step 7 · Arithmetic corrected"}, {"title": "Solving ordinary least squares", "steps": 2, "source": "Source normal equation · Added solution on the source dataset"}, {"title": "When coefficients are not unique", "steps": 1, "source": "Invertibility discussion · Intercept assumption clarified"}, {"title": "A penalty changes the objective", "steps": 2, "source": "Ridge worked example, Steps 2–3 · Normalisation clarified"}, {"title": "Ridge adds to the diagonal", "steps": 2, "source": "Ridge worked example, Steps 3–5"}, {"title": "The two-by-two inverse", "steps": 2, "source": "Ridge worked example, Step 6"}, {"title": "The corrected Ridge solution", "steps": 2, "source": "Ridge worked example, Step 8 · Corrected coefficients"}, {"title": "Changing regularisation strength", "steps": 2, "source": "Ridge parameter α · Added path demonstration"}, {"title": "Explain the fitted coefficients", "steps": 2, "source": "Regression and regularisation recap"}];
const X=[[1,2],[2,3],[3,4]], y=[5,7,9];
function regStats(theta,alpha=0){const pred=X.map(r=>r[0]*theta[0]+r[1]*theta[1]),res=pred.map((v,i)=>v-y[i]),sse=res.reduce((a,v)=>a+v*v,0),norm=theta.reduce((a,v)=>a+v*v,0);return {theta,pred,res,sse,norm,j:(sse+alpha*norm)/6,gradient:[0,1].map(j=>res.reduce((a,v,i)=>a+v*X[i][j],0)/3)};}
function ridge(alpha){const d=alpha*alpha+43*alpha+6;return [(46*alpha-6)/d,(67*alpha+18)/d];}
function initial(i){return {step:0,a:0,b:2,alpha:1,intercept:false};}
function mat(rows){return '<span class="mat">'+table([],rows,'matrix-table')+'</span>';}
function eq(text){return '<div class="equation">'+text+'</div>';}
function data(){return table(['x₁','x₂','y'],X.map((r,i)=>[...r,y[i]]));}
function regPlot(theta,residuals=true){const px=x=>72+x*145,py=v=>350-(v+12)*7.6;let h='<path d="M72 55V350H580" stroke="#8c9eac" fill="none"/>';for(const v of [-10,0,10,20])h+='<text class="tick" x="55" y="'+(py(v)+5)+'" text-anchor="end">'+v+'</text>';for(let v=0;v<=3;v++)h+='<text class="tick" x="'+px(v)+'" y="376" text-anchor="middle">'+v+'</text>';h+='<text class="axis" x="320" y="412" text-anchor="middle">Feature x₁, along x₂ = x₁ + 1</text>';
 h+='<text x="85" y="35" class="label" style="fill:#2463b7">Observed y</text><text x="320" y="35" class="label" style="fill:#bc3c4b">Prediction</text>'; const f=x=>theta[0]*x+theta[1]*(x+1);h+='<path d="M'+px(0)+' '+py(f(0))+'L'+px(3.3)+' '+py(f(3.3))+'" stroke="#bc3c4b" stroke-width="3"/>';
 X.forEach((r,i)=>{if(residuals)h+='<path d="M'+px(r[0])+' '+py(y[i])+'V'+py(f(r[0]))+'" stroke="#657f95" stroke-dasharray="5 4"/>';h+='<circle cx="'+px(r[0])+'" cy="'+py(y[i])+'" r="7" fill="#2463b7"/>';});setSvg('plot',h,'Observed responses, predictions and vertical residuals');}
function ridgePath(alpha){const px=a=>70+a*49,py=v=>340-(v+1.1)*72;let h='<path d="M70 45V340H580" stroke="#8c9eac" fill="none"/>';for(const a of [0,1,5,10])h+='<text class="tick" x="'+px(a)+'" y="366" text-anchor="middle">'+a+'</text>';for(const v of [-1,0,1,2,3])h+='<text class="tick" x="55" y="'+(py(v)+5)+'" text-anchor="end">'+v+'</text>';h+='<text class="axis" x="320" y="410" text-anchor="middle">Regularisation α</text>';[0,1].forEach(j=>{let d='';for(let a=0;a<=10.001;a+=.05)d+=(a?'L':'M')+px(a)+' '+py(ridge(a)[j])+' ';h+='<path d="'+d+'" fill="none" stroke="'+(j?'#bc3c4b':'#2463b7')+'" stroke-width="3"/><circle cx="'+px(alpha)+'" cy="'+py(ridge(alpha)[j])+'" r="7" fill="'+(j?'#bc3c4b':'#2463b7')+'"/>';});h+='<text x="430" y="48" class="label" style="fill:#2463b7">θ₁</text><text x="485" y="48" class="label" style="fill:#bc3c4b">θ₂</text>';setSvg('plot',h,'Ridge coefficients as the regularisation parameter changes');}
function liveCoefficients(){const v=regStats([s().a,s().b]);$('a-value').textContent=fmt(s().a,1);$('b-value').textContent=fmt(s().b,1);$('reg-live').innerHTML=table(['ŷ','y − ŷ'],v.pred.map((p,i)=>[fmt(p,1),fmt(y[i]-p,1)]))+'<p class="metric">Half-MSE = '+fmt(v.j)+'</p>';regPlot(v.theta);}
function liveRidge(){const v=regStats(ridge(s().alpha),s().alpha);$('alpha-value').textContent=fmt(s().alpha,1);$('ridge-live').innerHTML='<p>θ = ('+v.theta.map(x=>fmt(x)).join(', ')+')</p><p class="small">SSE = '+fmt(v.sse)+'<br>‖θ‖² = '+fmt(v.norm)+'</p>';ridgePath(s().alpha);}
function content(i,t,st){let left='',right='',after;
 if(i===0){left=data();right='<p class="lead">How do two feature coefficients produce these three responses?</p>'+pause('Could all three equations hold exactly? Make a prediction.')+(t?'<p>Use the source data throughout.<br>ŷ = θ₁x₁ + θ₂x₂</p><p class="muted">No intercept in this worked example.</p>':'<p class="muted">25–30 minutes · Predict before each reveal.</p>');}
 if(i===1){left=eq('X = '+mat(X)+' &nbsp; y = '+mat(y.map(v=>[v])))+'<p class="data-caption">X has 3 rows and 2 columns.</p>';right=pause('Why can we not calculate X⁻¹y here?')+(t?'<p>A rectangular matrix has no ordinary inverse.</p>':'')+(t>=2?'<p>It may still be possible to solve Xθ = y exactly. Having more equations than coefficients does not prove inconsistency.</p>':'');}
 if(i===2){left=visual();right='<p>Start with θ = (0, 2).</p>'+(t?'<div class="controls"><label><span>θ₁</span><input id="a" type="range" min="-2" max="2" step="0.1" value="'+st.a+'"><output id="a-value"></output></label><label><span>θ₂</span><input id="b" type="range" min="-1" max="4" step="0.1" value="'+st.b+'"><output id="b-value"></output></label></div><div id="reg-live" aria-live="polite"></div>':pause('What predictions and residuals does this coefficient pair produce?'));after=()=>{regPlot(t?[st.a,st.b]:[0,2],t>0);if(t){liveCoefficients();['a','b'].forEach(id=>$(id).oninput=e=>{s()[id]=+e.target.value;liveCoefficients();});}};}
 if(i===3){left=table(['y','ŷ','(y − ŷ)²'],[[5,4,1],[7,6,1],[9,8,1]]);right=t===0?pause('How do these three residuals become one optimisation objective?'):formula('SSE = 1 + 1 + 1 = 3<br>MSE = SSE / m = 1')+(t>=2?formula('J = SSE / (2m) = 1/2')+'<p class="muted">Half-MSE has the same unregularised minimisers. The factor ½ simplifies the derivative.</p>':'');}
 if(i===4){left=eq('J(θ) = (1 / 2m) Σᵢ (ŷᵢ − yᵢ)²')+(t?eq('∂J/∂θⱼ = (1/m) Σᵢ (ŷᵢ − yᵢ)xᵢⱼ'):'');right=t===0?pause('At θ = (0, 2), should each coefficient increase or decrease?'):formula('∇J = [−2, −3]ᵀ')+(t>=2?'<p>One step with η = 0.1:</p>'+formula('θnew = θ − η∇J = (0.2, 2.3)')+'<p>Half-MSE falls from 0.500 to 0.1283.</p>':'');}
 if(i===5){left=eq('J(θ) = (y − Xθ)ᵀ(y − Xθ) / (2m)')+(t?eq('∇J = Xᵀ(Xθ − y) / m'):'');right=t===0?pause('What equation must a stationary point satisfy?'):formula('Xᵀ(Xθ − y) = 0')+(t>=2?formula('XᵀXθ = Xᵀy')+'<p>These are the normal equations.</p><p class="muted">They remain meaningful even when XᵀX is singular.</p>':'');}
 if(i===6){left=eq('XᵀX = '+mat([[t?'1²+2²+3²':'? ',t?'1·2+2·3+3·4':'?'],[t?'2·1+3·2+4·3':'?',t?'2²+3²+4²':'?']]))+(t>=2?eq('= '+mat([[14,20],[20,29]])):'');right=pause('Which two columns enter each dot product?')+(t>=2?'<p>The off-diagonal entries agree because XᵀX is symmetric.</p><p class="muted">These are raw dot products, not normalised correlations.</p>':'');}
 if(i===7){left=data();right=t===0?pause('Compute each feature’s dot product with y.'):formula('Xᵀy = [1·5 + 2·7 + 3·9,<br>　　　　 2·5 + 3·7 + 4·9]ᵀ')+(t>=2?formula('= [46, 67]ᵀ')+'<p class="correction">The source writes 68 in the second entry. The displayed data give 67.</p>':'');}
 if(i===8){left=eq(mat([[14,20],[20,29]])+' θ = '+mat([[46],[67]]))+(t?eq('det(XᵀX) = 14·29 − 20² = 6'):'');right=t===0?pause('The determinant is nonzero. What coefficients solve this system?'):formula('θ = (1/6) '+mat([[29,-20],[-20,14]])+' '+mat([[46],[67]]))+(t>=2?'<p class="answer">θ = (−1, 3)</p><p>Predictions: (5, 7, 9).<br>All residuals are zero.</p>':'');}

let index=0,states=slides.map((_,i)=>initial(i));
const s=()=>states[index];
const maximum=()=>typeof slideSteps==='function'?slideSteps(index,s()):slides[index].steps;
function render(){
 const focus=document.activeElement&&document.activeElement.id;
 $('slide-title').textContent=slides[index].title;$('source').textContent=slides[index].source||'';
 const part=content(index,s().step,s());
 $('stage').innerHTML=part.html!==undefined?part.html:(part.left||'')+'<section class="copy">'+(part.right||'')+'</section>';
 if(part.after)part.after();
 $('counter').textContent='Slide '+(index+1)+' of '+slides.length;$('step-counter').textContent='Reveal '+s().step+' of '+maximum();$('jump').value=index;
 $('back').disabled=index===0&&s().step===0;$('advance').textContent=s().step<maximum()?'Reveal next':index<slides.length-1?'Next slide':'Start again';
 $('progress').style.width=100*(index+s().step/Math.max(1,maximum()))/slides.length+'%';
 $('announcement').textContent=slides[index].title+'. Reveal '+s().step+' of '+maximum();
 if(focus&&$(focus)&&!['jump','advance','back','reset'].includes(focus))$(focus).focus({preventScroll:true});
}
const refresh=()=>render();
function advance(){if(s().step<maximum())s().step++;else if(index<slides.length-1){index++;states[index]=initial(index);}else{index=0;states=slides.map((_,i)=>initial(i));}render();}
function back(){if(s().step>0)s().step--;else if(index>0){index--;s().step=maximum();}render();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('announcement').textContent='Open this file in a desktop browser to use full screen.';}}
$('jump').innerHTML=slides.map((v,i)=>'<option value="'+i+'">'+(i+1)+'. '+v.title+'</option>').join('');
$('jump').onchange=e=>{index=+e.target.value;states[index]=initial(index);render();};$('advance').onclick=advance;$('back').onclick=back;$('reset').onclick=()=>{states[index]=initial(index);render();};$('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||(e.key===' '&&['BUTTON','A'].includes(e.target.tagName)))return;if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();advance();}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();back();}else if(e.key==='Home'){e.preventDefault();index=0;states=slides.map((_,i)=>initial(i));render();}else if(e.key.toLowerCase()==='r'){states[index]=initial(index);render();}else if(e.key.toLowerCase()==='f')fullscreen();});
